  const SL = { zone:'BXN', bh:null, Hfill:3, lim:30, tc:6, loading:false };

  async function _loadBhs() {
    const zone = document.getElementById('sl-zone')?.value || 'BXN';
    try {
      const r = await fetch(`/api/boreholes?zone=${zone}`);
      const d = await r.json();
      const sel = document.getElementById('sl-bh');
      if (!sel) return;
      sel.innerHTML = d.boreholes.map(b=>`<option value="${b.name}">${b.name}</option>`).join('');
      SL.bh = d.boreholes[0]?.name || null;
    } catch(e) { console.warn(e); }
  }

  async function _compute() {
    const bh = document.getElementById('sl-bh')?.value;
    const zone = document.getElementById('sl-zone')?.value || 'BXN';
    const Hfill = parseFloat(document.getElementById('sl-Hfill')?.value) || 3;
    const lim = parseFloat(document.getElementById('sl-lim')?.value) || 30;
    const tc = parseFloat(document.getElementById('sl-tc')?.value) || 6;
    if (!bh || bh === '—') return;
    if (SL.loading) return;
    SL.loading = true;

    const tbody = document.getElementById('sl-cmp-body');
    if (tbody) tbody.innerHTML = `<tr><td colspan="7" style="color:#64748b;padding:20px">Đang tính toán...</td></tr>`;

    try {
      const r = await fetch(`/api/settlement/analyze?bh_name=${encodeURIComponent(bh)}&zone=${zone}&H_fill=${Hfill}&lim_cm=${lim}&tc_months=${tc}`);
      const d = await r.json();
      if (!d.ok) throw new Error(d.error);
      const res = d.result;

      // Metrics
      const mEl = document.getElementById('sl-metrics');
      const noTreat = res.scenarios.find(s=>s.method==='no_treat') || {};
      const cdm = res.scenarios.find(s=>s.method==='cdm') || {};
      const pct = res.S_total_cm>0 ? (100*(1-cdm.S_total_cm/res.S_total_cm)).toFixed(0) : '—';
      if (mEl) mEl.innerHTML = `
        <div class="sl-metric"><div class="val">${res.S_total_cm?.toFixed(1)??'—'}</div><div class="lbl">Lún tự nhiên S<sub>total</sub> (cm)</div></div>
        <div class="sl-metric"><div class="val">${cdm.S_total_cm?.toFixed(1)??'—'}</div><div class="lbl">CDM lún S₁ (cm)</div></div>
        <div class="sl-metric" style="border-left:3px solid #22c55e"><div class="val">${pct}%</div><div class="lbl">CDM giảm lún</div></div>
        <div class="sl-metric"><div class="val">${noTreat.t_90_months??'—'}</div><div class="lbl">t₉₀ không xử lý (tháng)</div></div>`;

      // Comparison table
      const METHOD_COLORS = {no_treat:'#64748b',pvd_1200:'#3b82f6',pvd_1500:'#06b6d4',sand_drain:'#f59e0b',cdm:'#22c55e'};
      if (tbody) tbody.innerHTML = res.scenarios.map(s=>{
        const feas = s.feasible ? '<span class="sl-badge-pass">Đạt</span>' : '<span class="sl-badge-fail">Không đạt</span>';
        const warn = s.residual_cm > lim ? `<span class="sl-badge-fail">${s.residual_cm?.toFixed(1)} > ${lim}</span>` : `<span class="sl-badge-pass">${s.residual_cm?.toFixed(1)}</span>`;
        return `<tr>
          <td style="text-align:left;font-weight:500"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${METHOD_COLORS[s.method]||'#888'};margin-right:6px"></span>${s.label}</td>
          <td>${s.S_total_cm?.toFixed(1)??'—'}</td>
          <td>${s.S_at_constr_cm?.toFixed(1)??'—'}</td>
          <td>${s.U_at_constr_pct?.toFixed(1)??'—'}</td>
          <td>${warn}</td>
          <td>${s.t_90_months??'—'}</td>
          <td>${feas}</td>
        </tr>`;
      }).join('');

      // Charts
      if (window.Plotly) {
        // S(t) time series
        const tsTraces = Object.entries(res.time_series).map(([key, pts])=>{
          const sc = res.scenarios.find(s=>s.method===key) || {label:key};
          return {
            x: pts.map(p=>p.t_months), y: pts.map(p=>p.S_cm),
            mode:'lines', name: sc.label,
            line:{color:METHOD_COLORS[key]||'#888',width:2},
            hovertemplate:'%{y:.1f} cm @ %{x} tháng<extra>'+sc.label+'</extra>'
          };
        });
        tsTraces.push({
          x:[tc,tc], y:[0, res.S_total_cm*1.1], mode:'lines',
          line:{color:'#f87171',dash:'dash',width:1.5},
          name:`Kết thúc TC (${tc}th)`, hoverinfo:'skip'
        });
        tsTraces.push({
          x:[0, Math.max(...Object.values(res.time_series)[0]?.map(p=>p.t_months)||[120])],
          y:[lim,lim], mode:'lines',
          line:{color:'#fbbf24',dash:'dot',width:1.5},
          name:`Giới hạn lún ${lim}cm`, hoverinfo:'skip'
        });
        Plotly.newPlot('sl-ch-st', tsTraces, {
          ...DARK, title:'Quan hệ lún theo thời gian S(t)',
          xaxis:{title:'Thời gian (tháng)'},
          yaxis:{title:'Độ lún (cm)'},
          legend:{x:0,y:1,orientation:'h'},
          margin:{t:40,b:40,l:50,r:20}
        },{responsive:true});

        // Bar: S_total vs S_at_constr vs S_residual
        const labels = res.scenarios.map(s=>s.label);
        const colors = res.scenarios.map(s=>METHOD_COLORS[s.method]||'#888');
        Plotly.newPlot('sl-ch-bar', [
          {type:'bar',name:'Lún tổng (cm)',x:labels,y:res.scenarios.map(s=>s.S_total_cm),marker:{color:colors,opacity:.9}},
          {type:'bar',name:'Lún tại TC (cm)',x:labels,y:res.scenarios.map(s=>s.S_at_constr_cm),marker:{color:colors,opacity:.6}},
          {type:'bar',name:'Lún còn lại (cm)',x:labels,y:res.scenarios.map(s=>s.residual_cm),marker:{color:res.scenarios.map(s=>s.residual_cm>lim?'#ef4444':'#22c55e'),opacity:.8}},
        ], {
          ...DARK, title:'Phân bố độ lún — so sánh phương án',
          barmode:'group',
          xaxis:{tickangle:-20},yaxis:{title:'cm'},
          shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:lim,y1:lim,line:{color:'#fbbf24',dash:'dot',width:1.5}}],
          legend:{x:0,y:1,orientation:'h'},
          margin:{t:40,b:60,l:50,r:20}
        },{responsive:true});
      }

      // Warning
      const wEl = document.getElementById('sl-warn');
      if (wEl && res.S_detail?.warning) wEl.textContent = `Lưu ý: ${res.S_detail.warning}`;
      else if (wEl) wEl.textContent = '';

    } catch(err) {
      const tbody2 = document.getElementById('sl-cmp-body');
      if (tbody2) tbody2.innerHTML = `<tr><td colspan="7" style="color:#f87171;padding:20px">Lỗi: ${err.message}</td></tr>`;
    } finally {
      SL.loading = false;
    }
  }

  document.getElementById('sl-zone')?.addEventListener('change', async () => {
    await _loadBhs();
    _compute();
  });
  document.getElementById('sl-bh')?.addEventListener('change', _compute);
  ['sl-Hfill','sl-lim','sl-tc'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', _compute);
  });

  await _loadBhs();
  _compute();
}

      const ratio = db.ratio_nt2;

      const ratioStyle = ratio == null ? '' :
        ratio < 1.0 ? 'color:#f87171;font-weight:600' :
        ratio < 1.5 ? 'color:#fbbf24;font-weight:600' : 'color:#6ee7b7';
      const userPileVal = _userRec[bhName] || jcfg.recommended_pile || optName;
      const defaultL = jcfg.recommended_L_m ?? optLmax ?? '';
      const userLVal  = _userL[bhName] != null ? _userL[bhName] : defaultL;
      return `<tr>
        <td class="left" style="font-weight:600">${bhName.replace('KE-','')}</td>
        <td>${Z != null ? Z.toFixed(2) : '—'}</td>
        <td>${Dbot != null ? Dbot.toFixed(2) : '—'}</td>
        <td>${Lreq != null ? Lreq.toFixed(2) : '—'}</td>
        <td style="font-weight:600;color:#38bdf8">${optName}</td>
        <td>${optLmax != null ? optLmax.toFixed(1) : '—'}</td>
        <td>${enoughL}</td>
        <td>${nt1B}</td>
        <td>${db.Rs_kN != null ? db.Rs_kN.toFixed(0) : '—'}</td>
        <td>${db.Rp_kN != null ? db.Rp_kN.toFixed(0) : '—'}</td>
        <td>${db.RR_kN != null ? db.RR_kN.toFixed(0) : '—'}</td>
        <td>${db.W_kN != null ? db.W_kN.toFixed(0) : '—'}</td>
        <td style="${ratioStyle}">${ratioFmt}</td>
        <td>${nt2B}</td>
        <td>
          <select class="sw-rec" data-bh="${bhName}">
            ${pileOpts.map(n => `<option value="${n}" ${n===userPileVal?'selected':''}>${n}</option>`).join('')}
          </select>
        </td>
        <td>
          <input type="number" class="sw-L" data-bh="${bhName}"
                 step="0.5" min="6" max="50" value="${userLVal}"/>
        </td>
        <td style="font-size:.74rem;color:#94a3b8;text-align:left;max-width:240px">${jcfg.note||''}</td>
      </tr>`;
    }).join('');
    tbody.innerHTML = html;

    tbody.querySelectorAll('select.sw-rec').forEach(sel => {
      sel.addEventListener('change', e => {
        _userRec[e.target.dataset.bh] = e.target.value;
        _saveLS(LS_REC_KEY, _userRec);
        const lmax = _getLMax(e.target.value, _allPiles);
        if (lmax != null) {
          const linput = tbody.querySelector(`input.sw-L[data-bh="${e.target.dataset.bh}"]`);
          if (linput) {
            linput.value = lmax;
            _userL[e.target.dataset.bh] = lmax;
            _saveLS(LS_L_KEY, _userL);
          }
        }
      });
    });
    tbody.querySelectorAll('input.sw-L').forEach(inp => {
      inp.addEventListener('change', e => {
        _userL[e.target.dataset.bh] = parseFloat(e.target.value);
        _saveLS(LS_L_KEY, _userL);
      });
    });
  }

  async function _loadDesign() {
    try {
      const r = await fetch('/api/ke-sw/design');
      const d = await r.json();
      const nt = d.nt_detail || [];
      const cfg = d.config || {};
      const bhs_cfg = cfg.boreholes || [];
      const align_names = bhs_cfg.filter(b=>b.on_sw_alignment).map(b=>'KE-'+b.name);
      const ntMap = {};
      nt.forEach(row => {
        const bn = row.bh_name;
        if (!ntMap[bn] || row.pile_type === 'SW-840' || row.pile_type === 'SW-940') ntMap[bn] = row;
      });
      const cfgMap = {};
      bhs_cfg.forEach(b => { cfgMap['KE-'+b.name] = b; });
      _allRows = align_names.map(bhName => ({
        bhName,
        db: ntMap[bhName] || {},
        jcfg: cfgMap[bhName] || {},
      }));
      _renderDesignTable();
    } catch(e) {
      const tb = document.getElementById('sw-design-body');
      if (tb) tb.innerHTML = `<tr><td colspan="17" style="color:#f87171">${e.message}</td></tr>`;
    }
  }

  // ── B.2 Trắc dọc địa chất + B.3 Bình đồ ──
  // Màu lớp đất chuẩn (giống 8503)
  const LAYER_COLORS = {
    '1':'#FFB300', '1b':'#FFE082', 'XMD':'#FF7043',
    '2':'#FBC02D', '2a':'#FFEB3B', '2b':'#F9A825', '2c':'#F57F17',
    '3':'#6D4C41', '4':'#8D6E63',
    '5':'#5D4037', '5a':'#A1887F',
    '6':'#3E2723', '7':'#212121',
    'F':'#90CAF9',
  };

  async function _loadProfile() {
    let data;
    try {
      data = await fetch('/api/ke-sw/profile-chainage').then(r=>r.json());
    } catch(e) {
      document.getElementById('sw-tracdoc').innerHTML =
        `<div style="color:#f87171;padding:14px">Lỗi tải trắc dọc: ${e.message}</div>`;
      return;
    }
    if (!data.boreholes || !data.boreholes.length) {
      document.getElementById('sw-tracdoc').innerHTML =
        `<div style="color:#94a3b8;padding:14px">Không có dữ liệu HK trên tuyến.</div>`;
      return;
    }

    // Build symbol list for selectbox
    const allSyms = new Set();
    data.boreholes.forEach(b => b.layers.forEach(l => allSyms.add(l.symbol)));
    const syms = [...allSyms].filter(s => s !== '1').sort();
    const sel = document.getElementById('sw-layer-sel');
    sel.innerHTML = '<option value="">— tự chọn —</option>' +
      syms.map(s => `<option value="${s}">${s}</option>`).join('');

    // Auto-select common 2nd layer if available
    if (syms.includes('2')) sel.value = '2';
    else if (syms.includes('1b')) sel.value = '1b';

    function _drawProfile() {
      const top_ke   = parseFloat(document.getElementById('sw-top-elev').value);
      const water_ke = parseFloat(document.getElementById('sw-water-elev').value);
      const layerSel = sel.value;
      const bhs = data.boreholes;
      const chs = bhs.map(b => b.chainage_m);
      const ground_y = bhs.map(b => b.elevation_m);

      const traces = [];
      // Mặt đất tự nhiên
      traces.push({
        x: chs, y: ground_y, mode:'lines+markers',
        name:'Mặt đất tự nhiên',
        line:{color:'#8B6F47', width:2},
        marker:{color:'#8B6F47', size:7, symbol:'circle'},
        hovertemplate: bhs.map(b => `<b>${b.short_name}</b><br>Cao độ: ${b.elevation_m.toFixed(2)}m<br>Chainage: ${b.chainage_m.toFixed(1)}m<extra></extra>`),
      });

      // Lớp 1 (bùn) — fill từ đỉnh xuống đáy lớp 1
      const lay1_top = bhs.map(b => {
        const l = b.layers.find(x => x.symbol === '1' || x.symbol === '1b');
        return l ? l.elev_top_m : b.elevation_m;
      });
      const lay1_bot = bhs.map(b => {
        const lays = b.layers.filter(x => x.symbol === '1' || x.symbol === '1b');
        return lays.length ? lays[lays.length - 1].elev_bot_m : b.elevation_m - 25;
      });
      traces.push({
        x: chs, y: lay1_top, fill:'none', mode:'lines',
        line:{color:'transparent'}, showlegend:false, hoverinfo:'skip',
      });
      traces.push({
        x: chs, y: lay1_bot, fill:'tonexty', mode:'lines',
        line:{color:LAYER_COLORS['1'], width:2, dash:'dash'},
        fillcolor: LAYER_COLORS['1'] + '60',
        name:'Lớp 1 (bùn sét yếu)',
        hovertemplate: bhs.map(b => {
          const lays = b.layers.filter(x => x.symbol === '1' || x.symbol === '1b');
          const Su_vst = b.vst.length ? (b.vst.reduce((s,v)=>s+v.Su_kPa,0)/b.vst.length).toFixed(1) : '—';
          return `<b>${b.short_name} · Lớp 1</b><br>Đáy: ${lays.length?lays[lays.length-1].elev_bot_m.toFixed(2):'—'}m<br>su VST TB: ${Su_vst} kPa<extra></extra>`;
        }),
      });

      // Lớp dưới user chọn
      if (layerSel) {
        const lay2_top = bhs.map(b => {
          const l = b.layers.find(x => x.symbol === layerSel);
          return l ? l.elev_top_m : null;
        });
        const lay2_bot = bhs.map(b => {
          const l = b.layers.find(x => x.symbol === layerSel);
          return l ? l.elev_bot_m : null;
        });
        const col = LAYER_COLORS[layerSel] || '#999';
        traces.push({
          x: chs, y: lay2_top, fill:'none', mode:'lines+markers',
          line:{color:col, width:1.5},
          marker:{symbol:'triangle-up', size:8, color:col},
          name:`Lớp ${layerSel} — đỉnh`,
        });
        traces.push({
          x: chs, y: lay2_bot, fill:'tonexty', mode:'lines+markers',
          line:{color:col, width:1.5, dash:'dot'},
          marker:{symbol:'triangle-down', size:8, color:col},
          fillcolor: col + '40',
          name:`Lớp ${layerSel} — đáy`,
        });
      }

      // Đáy lớp đất yếu (D_bottom_soft) → query từ table _allRows
      const Dbot_y = bhs.map(b => {
        const row = _allRows.find(r => r.bhName === b.name);
        const Dbot = row?.db?.D_bottom_soft_m ?? row?.jcfg?.H_layer1_m;
        return Dbot != null ? b.elevation_m - Dbot : null;
      });
      if (Dbot_y.some(v => v != null)) {
        traces.push({
          x: chs, y: Dbot_y, mode:'lines+markers',
          name:'Đáy lớp đất yếu (NT1)',
          line:{color:'#EC4899', width:2, dash:'dashdot'},
          marker:{symbol:'diamond', size:9, color:'#EC4899'},
          hovertemplate: bhs.map((b,i) => Dbot_y[i] != null
            ? `<b>${b.short_name}</b><br>Đáy lớp yếu: ${Dbot_y[i].toFixed(2)}m<extra></extra>`
            : '<extra></extra>'),
        });
      }

      // Mũi cọc thiết kế = top_ke - L_design
      const tip_y = bhs.map(b => {
        const L = _userL[b.name] ?? _allRows.find(r => r.bhName === b.name)?.jcfg?.recommended_L_m;
        return L ? top_ke - L : null;
      });
      if (tip_y.some(v => v != null)) {
        traces.push({
          x: chs, y: tip_y, mode:'lines+markers',
          name:'Mũi cọc thiết kế',
          line:{color:'#F97316', width:2.5},
          marker:{symbol:'triangle-down', size:12, color:'#F97316'},
          hovertemplate: bhs.map((b,i) => tip_y[i] != null
            ? `<b>${b.short_name}</b><br>Cao độ mũi: ${tip_y[i].toFixed(2)}m<extra></extra>`
            : '<extra></extra>'),
        });
      }

      // Đỉnh kè + mặt nước (hlines)
      const xmin = Math.min(...chs) - 20, xmax = Math.max(...chs) + 20;
      traces.push({
        x:[xmin, xmax], y:[top_ke, top_ke], mode:'lines',
        line:{color:'#22D3EE', width:2}, name:`Đỉnh kè TK (+${top_ke}m)`,
      });
      traces.push({
        x:[xmin, xmax], y:[water_ke, water_ke], mode:'lines',
        line:{color:'#3B82F6', width:1.5, dash:'dot'},
        name:`MN (+${water_ke}m)`,
      });

      // X-axis labels with BH names
      const layout = {
        ...DARK, height:480,
        title:{ text:'Trắc dọc địa chất theo tuyến kè SW (PCA-SVD chainage)', font:{size:13} },
        xaxis:{
          title:'Chainage dọc tuyến (m)', gridcolor:'#374151',
          tickmode:'array', tickvals:chs,
          ticktext: bhs.map(b => `${b.short_name}<br>${b.chainage_m.toFixed(0)}m`),
          tickfont:{size:10},
        },
        yaxis:{title:'Cao độ (m)', gridcolor:'#374151'},
        legend:{orientation:'h', y:-0.18, x:0},
        hovermode:'closest', margin:{t:40,b:90,l:60,r:20},
      };
      Plotly.newPlot('sw-tracdoc', traces, layout, {responsive:true, displayModeBar:false});
    }

    _drawProfile();
    document.getElementById('sw-top-elev').addEventListener('change', _drawProfile);
    document.getElementById('sw-water-elev').addEventListener('change', _drawProfile);
    sel.addEventListener('change', _drawProfile);

    // ── B.3 Bình đồ ──
    const bhs = data.boreholes;
    const aln = data.alignment_polyline || [];
    // boreholes: x_coord_m=Northing, y_coord_m=Easting
    // Plot: X=Easting (E), Y=Northing (N), scaleratio=1
    const traces2 = [];
    if (aln.length) {
      // group by polyline_id
      const polys = {};
      aln.forEach(v => { (polys[v.polyline_id] = polys[v.polyline_id] || []).push(v); });
      let first = true;
      Object.values(polys).forEach(p => {
        traces2.push({
          x: p.map(v => v.x_m), y: p.map(v => v.y_m),
          mode:'lines', line:{color:'#000', width:1.5},
          name:'Tuyến kè', legendgroup:'aln',
          showlegend: first, hoverinfo:'skip',
        });
        first = false;
      });
    }
    traces2.push({
      x: bhs.map(b => b.y_coord_m), y: bhs.map(b => b.x_coord_m),
      mode:'markers+text', text: bhs.map(b => b.short_name),
      textposition:'top right', textfont:{size:11,color:'#fbbf24'},
      marker:{size:13, color:'#ef4444', line:{color:'#fff',width:2}},
      name:'Hố khoan trên tuyến',
      hovertemplate:'<b>%{text}</b><br>N=%{y:,.1f}m<br>E=%{x:,.1f}m<extra></extra>',
    });

    const layout2 = {
      ...DARK, height:500,
      title:{text:'Bình đồ vị trí hố khoan (tỷ lệ 1:1)', font:{size:13}},
      xaxis:{title:'Easting (m)', gridcolor:'#374151'},
      yaxis:{title:'Northing (m)', gridcolor:'#374151',
             scaleanchor:'x', scaleratio:1},
      legend:{orientation:'h', y:-0.12},
      margin:{t:40,b:70,l:80,r:20},
    };
    Plotly.newPlot('sw-binhdo', traces2, layout2, {responsive:true, displayModeBar:false});

    // Bảng khoảng cách
    const distBody = document.getElementById('sw-dist-body');
    if (distBody) {
      let total_eucl = 0, total_ch = 0;
      const distRows = (data.distances || []).map(d => {
        total_eucl += d.distance_m;
        total_ch += d.chainage_diff_m;
        return `<tr>
          <td>${d.from}</td><td>${d.to}</td>
          <td>${d.distance_m.toFixed(1)}</td>
          <td>${d.chainage_diff_m.toFixed(1)}</td>
        </tr>`;
      });
      distRows.push(`<tr style="background:#1e293b;font-weight:600">
        <td colspan="2" class="left" style="padding-left:14px">Tổng</td>
        <td>${total_eucl.toFixed(1)}</td>
        <td>${total_ch.toFixed(1)}</td>
      </tr>`);
      distBody.innerHTML = distRows.join('');
    }
  }

  // ── Buttons ──
  document.getElementById('sw-btn-optimal')?.addEventListener('click', () => {
    _allRows.forEach(row => {
      const Lreq = row.db.L_req_nt1_m ?? row.jcfg.L_req_m ?? 0;
      const opt = _pickOptimal(Lreq, _allPiles);
      if (opt) {
        _userRec[row.bhName] = opt.name;
        _userL[row.bhName] = opt.L_max_m;
      }
    });
    _saveLS(LS_REC_KEY, _userRec);
    _saveLS(LS_L_KEY, _userL);
    _renderDesignTable();
    _loadProfile();  // refresh mũi cọc trên trắc dọc
  });
  document.getElementById('sw-btn-reset')?.addEventListener('click', () => {
    _userRec = {}; _userL = {};
    localStorage.removeItem(LS_REC_KEY);
    localStorage.removeItem(LS_L_KEY);
    _renderDesignTable();
    _loadProfile();
  });
  document.getElementById('sw-fc')?.addEventListener('change', _loadCatalog);

  await Promise.all([_loadCatalog(), _loadDesign()]);
  await _loadProfile();
}

// ─────────────────────────────────────────────────────────────────────────────
// PAGE: TKBVTC Cọc ván SW — Nội lực Winkler + Ổn định tổng thể
// ─────────────────────────────────────────────────────────────────────────────
async function pageBvtSw(el) {
  if (!document.getElementById('bvt-style')) {
    const s = document.createElement('style'); s.id = 'bvt-style';
    s.textContent = `
      .bvt-section{margin-bottom:2rem}
      .bvt-section h2{font-size:1.05rem;font-weight:600;color:var(--accent);
        border-bottom:1px solid var(--border);padding-bottom:.35rem;margin-bottom:.85rem}
      .bvt-kpi{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
      .bvt-kpi .kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;
        padding:.6rem 1rem;min-width:130px;flex:1}
      .bvt-kpi .kpi .kv{font-size:1.35rem;font-weight:700;color:var(--accent)}
      .bvt-kpi .kpi .kl{font-size:.72rem;color:var(--muted);margin-top:.15rem}
      .bvt-tbl{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:1rem}
      .bvt-tbl th{background:var(--card);padding:.45rem .7rem;text-align:center;
        border-bottom:2px solid var(--border);white-space:nowrap}
      .bvt-tbl td{padding:.4rem .65rem;border-bottom:1px solid var(--border);text-align:center}
      .bvt-tbl tr:hover td{background:var(--hover,rgba(255,255,255,.04))}
      .badge-ok{background:#166534;color:#bbf7d0;padding:.12rem .5rem;border-radius:12px;font-size:.72rem}
      .badge-ng{background:#7f1d1d;color:#fecaca;padding:.12rem .5rem;border-radius:12px;font-size:.72rem}
      .badge-warn{background:#78350f;color:#fde68a;padding:.12rem .5rem;border-radius:12px;font-size:.72rem}
      .bvt-cond{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem}
      .bvt-cond .ci{background:var(--card);border:1px solid var(--border);border-radius:8px;
        padding:.6rem .85rem;font-size:.82rem}
      .bvt-cond .ci .ck{color:var(--muted);font-size:.72rem}
      .bvt-cond .ci .cv{font-weight:600;color:var(--text);margin-top:.1rem}
    `;
    document.head.appendChild(s);
  }

  el.innerHTML = `
    <h1>TKBVTC — Cọc ván SW Kè Công Viên</h1>

    <div class="bvt-section">
      <h2>A. Nội lực theo mô hình đàn hồi nền</h2>
      <div class="bvt-kpi" id="bvt-wkpi"></div>
      <div id="bvt-wtbl-wrap" style="overflow-x:auto"></div>
      <div id="bvt-wch" style="height:360px;margin-top:.75rem"></div>
    </div>

    <div class="bvt-section">
      <h2>B. Ổn định tổng thể (phương pháp Fellenius)</h2>
      <div class="bvt-kpi" id="bvt-skpi"></div>
      <div id="bvt-stbl-wrap" style="overflow-x:auto"></div>
      <div id="bvt-sch" style="height:340px;margin-top:.75rem"></div>
    </div>

    <div class="bvt-section">
      <h2>C. Thông số thiết kế cơ sở</h2>
      <div class="bvt-cond" id="bvt-cond"></div>
    </div>
  `;

  // ── helpers ──
  function badge(ok, yesText='Đạt', noText='Không đạt') {
    return ok
      ? `<span class="badge-ok">${yesText}</span>`
      : `<span class="badge-ng">${noText}</span>`;
  }
  function kpi(val, label, color='var(--accent)') {
    return `<div class="kpi"><div class="kv" style="color:${color}">${val}</div><div class="kl">${label}</div></div>`;
  }
  function fmt1(v) { return v == null ? '—' : Number(v).toFixed(1); }
  function fmt2(v) { return v == null ? '—' : Number(v).toFixed(2); }
  function fmt3(v) { return v == null ? '—' : Number(v).toFixed(3); }

  // ── Section A: Winkler ──
  async function _loadWinkler() {
    let data;
    try { data = await fetch('/api/ke-sw/winkler').then(r=>r.json()); }
    catch(e) { document.getElementById('bvt-wtbl-wrap').innerHTML = '<p style="color:#ef4444">Không tải được kết quả nội lực.</p>'; return; }

    const rows = data.rows || [];
    if (!rows.length) {
      document.getElementById('bvt-wtbl-wrap').innerHTML = '<p style="color:var(--muted)">Chưa có kết quả nội lực Winkler.</p>';
      return;
    }

    // Aggregate per BH: worst load_case (max mcr_ratio)
    const bhMap = {};
    for (const r of rows) {
      const bn = r.bh_name;
      if (!bhMap[bn] || r.mcr_ratio > bhMap[bn].mcr_ratio) bhMap[bn] = r;
    }
    const agg = Object.values(bhMap).sort((a,b)=>a.bh_name.localeCompare(b.bh_name));

    const nOk = agg.filter(r => r.mcr_ok && r.u_ok).length;
    const wMax = Math.max(...agg.map(r=>r.M_max_kNm||0));
    const uMax = Math.max(...agg.map(r=>r.u_max_mm||0));
    const ratMax = Math.max(...agg.map(r=>r.mcr_ratio||0));

    document.getElementById('bvt-wkpi').innerHTML =
      kpi(`${nOk}/${agg.length}`, 'Hố khoan đạt (M+chuyển vị)', nOk===agg.length?'#22c55e':'#ef4444') +
      kpi(fmt1(wMax)+' kN·m', 'M_max lớn nhất') +
      kpi(fmt1(uMax)+' mm', 'Chuyển vị đầu cọc lớn nhất') +
      kpi(fmt2(ratMax), 'Tỷ số M/Mcr lớn nhất', ratMax<0.8?'#22c55e':ratMax<1.0?'#f59e0b':'#ef4444');

    // Table
    let html = `<table class="bvt-tbl">
      <thead><tr>
        <th>Hố khoan</th><th>Loại cọc</th><th>L thiết kế (m)</th>
        <th>M_max (kN·m)</th><th>Mcr (kN·m)</th><th>M/Mcr</th>
        <th>Q_max (kN)</th><th>u_max (mm)</th><th>Kiểm tra M</th><th>Kiểm tra u</th>
      </tr></thead><tbody>`;
    for (const r of agg) {
      const mrColor = r.mcr_ratio < 0.8 ? '#22c55e' : r.mcr_ratio < 1.0 ? '#f59e0b' : '#ef4444';
      html += `<tr>
        <td>${r.bh_name}</td>
        <td>${r.pile_type||'—'}</td>
        <td>${fmt1(r.L_m)}</td>
        <td>${fmt1(r.M_max_kNm)}</td>

        <td>${badge(r.mcr_ok)}</td>

    }
    html += '</tbody></table>';
    document.getElementById('bvt-wtbl-wrap').innerHTML = html;

    // Chart: M_max vs Mcr grouped bar
    const bhs  = agg.map(r=>r.bh_name.replace('KE-',''));
    const mVals = agg.map(r=>r.M_max_kNm||0);
    const cVals = agg.map(r=>r.Mcr_kNm||0);
    const barColors = agg.map(r => r.mcr_ok ? '#22c55e' : '#ef4444');

    Plotly.newPlot('bvt-wch', [
      { type:'bar', name:'M_max (kN·m)', x:bhs, y:mVals,
        marker:{ color:barColors }, text:mVals.map(v=>fmt1(v)), textposition:'outside' },
      { type:'scatter', mode:'lines+markers', name:'Mcr (sức kháng nứt)',
        x:bhs, y:cVals, line:{ color:'#f59e0b', dash:'dash', width:2 },
        marker:{ symbol:'diamond', size:8, color:'#f59e0b' } },
    ], {
      ...DARK, height:340,
      title:{ text:'Mô men uốn lớn nhất vs Sức kháng nứt Mcr', font:{size:13} },
      yaxis:{ title:'kN·m', gridcolor:'#374151' },
      xaxis:{ title:'Hố khoan', gridcolor:'#374151' },
      legend:{ orientation:'h', y:1.12 },
      bargap:0.35,
    }, {responsive:true, displayModeBar:false});
  }

  // ── Section B: Stability ──
  async function _loadStability() {
    let data;
    try { data = await fetch('/api/ke-sw/stability').then(r=>r.json()); }
    catch(e) { document.getElementById('bvt-stbl-wrap').innerHTML = '<p style="color:#ef4444">Không tải được kết quả ổn định.</p>'; return; }

    const rows = data.rows || [];
    if (!rows.length) {
      document.getElementById('bvt-stbl-wrap').innerHTML = '<p style="color:var(--muted)">Chưa có kết quả ổn định tổng thể.</p>';
      return;
    }

    // Best (max Fs_slip) per BH
    const bhMap = {};
    for (const r of rows) {
      const bn = r.bh_name;
      if (!bhMap[bn] || r.Fs_slip > bhMap[bn].Fs_slip) bhMap[bn] = r;
    }
    const agg = Object.values(bhMap).sort((a,b)=>a.bh_name.localeCompare(b.bh_name));
    const FS_SLIP_MIN = 1.25, FS_OT_MIN = 1.50;

    const nSlip = agg.filter(r=>r.Fs_slip>=FS_SLIP_MIN).length;
    const nOt   = agg.filter(r=>r.Fs_overturning>=FS_OT_MIN).length;
    const fsMin = Math.min(...agg.map(r=>r.Fs_slip||0));
    const otMin = Math.min(...agg.map(r=>r.Fs_overturning||0));

    document.getElementById('bvt-skpi').innerHTML =
      kpi(`${nSlip}/${agg.length}`, `Trượt đạt (Fs≥${FS_SLIP_MIN})`, nSlip===agg.length?'#22c55e':'#ef4444') +
      kpi(`${nOt}/${agg.length}`, `Lật đạt (Fs≥${FS_OT_MIN})`, nOt===agg.length?'#22c55e':'#ef4444') +
      kpi(fmt2(fsMin), 'Fs trượt nhỏ nhất', fsMin>=FS_SLIP_MIN?'#22c55e':'#ef4444') +
      kpi(fmt2(otMin), 'Fs lật nhỏ nhất', otMin>=FS_OT_MIN?'#22c55e':'#ef4444');

    // Table
    let html = `<table class="bvt-tbl">
      <thead><tr>
        <th>Hố khoan</th><th>Loại cọc</th><th>L (m)</th>
        <th>Fs trượt</th><th>Đạt trượt</th><th>Fs lật</th><th>Đạt lật</th>
        <th>Z đáy bùn (m)</th><th>Su trước (kPa)</th><th>Su sau (kPa)</th>
      </tr></thead><tbody>`;
    for (const r of agg) {
      const slipOk = r.Fs_slip >= FS_SLIP_MIN;
      const otOk   = r.Fs_overturning >= FS_OT_MIN;
      const slipColor = slipOk ? '#22c55e' : '#ef4444';
      const otColor   = otOk   ? '#22c55e' : '#ef4444';
      html += `<tr>
        <td>${r.bh_name}</td>
        <td>${r.pile_type||'—'}</td>
        <td>${fmt1(r.L_m)}</td>
        <td style="color:${slipColor};font-weight:600">${fmt2(r.Fs_slip)}</td>
        <td>${badge(slipOk)}</td>
        <td style="color:${otColor};font-weight:600">${fmt2(r.Fs_overturning)}</td>
        <td>${badge(otOk)}</td>
        <td>${fmt1(r.Zb_m)}</td>
        <td>${fmt1(r.su_front)}</td>
        <td>${fmt1(r.su_back)}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    document.getElementById('bvt-stbl-wrap').innerHTML = html;

    // Chart: Fs_slip + Fs_overturning grouped bar + thresholds
    const bhs    = agg.map(r=>r.bh_name.replace('KE-',''));
    const fsVals = agg.map(r=>r.Fs_slip||0);
    const otVals = agg.map(r=>r.Fs_overturning||0);
    const slipColors = fsVals.map(v => v>=FS_SLIP_MIN ? '#22c55e' : '#ef4444');
    const otColors   = otVals.map(v => v>=FS_OT_MIN   ? '#3b82f6' : '#ef4444');

    Plotly.newPlot('bvt-sch', [
      { type:'bar', name:'Fs trượt', x:bhs, y:fsVals, marker:{color:slipColors},
        text:fsVals.map(v=>fmt2(v)), textposition:'outside' },
      { type:'bar', name:'Fs lật', x:bhs, y:otVals, marker:{color:otColors},
        text:otVals.map(v=>fmt2(v)), textposition:'outside' },
      { type:'scatter', mode:'lines', name:`Fs_slip,min = ${FS_SLIP_MIN}`, x:bhs,
        y:Array(bhs.length).fill(FS_SLIP_MIN),
        line:{color:'#22c55e', dash:'dot', width:1.5}, showlegend:true },
      { type:'scatter', mode:'lines', name:`Fs_lật,min = ${FS_OT_MIN}`, x:bhs,
        y:Array(bhs.length).fill(FS_OT_MIN),
        line:{color:'#3b82f6', dash:'dot', width:1.5}, showlegend:true },
    ], {
      ...DARK, height:320, barmode:'group',
      title:{ text:'Hệ số ổn định tổng thể — Fellenius', font:{size:13} },
      yaxis:{ title:'Hệ số an toàn', gridcolor:'#374151', range:[0, Math.max(...fsVals,...otVals)*1.2] },
      xaxis:{ title:'Hố khoan', gridcolor:'#374151' },
      legend:{ orientation:'h', y:1.14 },
      bargap:0.25, bargroupgap:0.08,
    }, {responsive:true, displayModeBar:false});
  }

  // ── Section C: Design conditions ──
  async function _loadConditions() {
    // Lấy từ winkler rows mẫu + stability rows mẫu để hiển thị thông số
    let wData, sData;
    try {
      [wData, sData] = await Promise.all([
        fetch('/api/ke-sw/winkler').then(r=>r.json()),
        fetch('/api/ke-sw/stability').then(r=>r.json()),
      ]);
    } catch(e) { return; }

    const sr = (sData.rows||[])[0] || {};
    const wr = (wData.rows||[])[0] || {};

    const cond = [
      { k:'Cao độ đỉnh kè thiết kế', v: sr.top_elev!=null ? `+${Number(sr.top_elev).toFixed(2)} m` : '—' },
      { k:'Mực nước phía trước kè', v: sr.wlvl_front!=null ? `${Number(sr.wlvl_front).toFixed(2)} m` : '—' },
      { k:'Mực nước phía sau kè (sông)', v: sr.wlvl_back!=null ? `${Number(sr.wlvl_back).toFixed(2)} m` : '—' },
      { k:'Tải trọng hoạt động q', v: sr.q_kPa!=null ? `${Number(sr.q_kPa).toFixed(0)} kPa` : '—' },
      { k:'Tỷ lệ thay thế CDM a', v: sr.cdm_a!=null ? `${(Number(sr.cdm_a)*100).toFixed(0)}%` : '—' },
      { k:'Cường độ trụ CDM (thực tế)', v: sr.cdm_c_col!=null ? `${Number(sr.cdm_c_col).toFixed(0)} kPa` : '—' },
      { k:'Phương pháp ổn định', v: 'Fellenius (phân mảnh đơn giản)' },
      { k:'Mô hình nội lực', v: 'Đàn hồi nền Winkler (NumPy)' },
      { k:'Tiêu chuẩn thiết kế', v: 'TCVN 9747 + USACE EM 1110-2-2504' },
    ];

    document.getElementById('bvt-cond').innerHTML = cond
      .map(c=>`<div class="ci"><div class="ck">${c.k}</div><div class="cv">${c.v}</div></div>`)
      .join('');
  }

  await Promise.all([_loadWinkler(), _loadStability(), _loadConditions()]);
}

async function drawLeaflet(epsg = 9210) {
  const data = await api(`/api/geo/locations?epsg=${epsg}`);
  if (data.error) {
    document.getElementById('leaflet-map').innerHTML =
      `<div class="info-box" style="margin:1rem">Lỗi chuyển đổi tọa độ: ${data.error}</div>`;
    return;
  }

  const { boreholes, ke_lines, cdm_zones } = data;
  if (!boreholes.length) {
    document.getElementById('leaflet-map').innerHTML =
      `<div class="info-box" style="margin:1rem">Không có dữ liệu tọa độ hố khoan.</div>`;
    return;
  }

  // Center = trung bình các HK
  const latC = boreholes.reduce((s, b) => s + b.lat, 0) / boreholes.length;
  const lonC = boreholes.reduce((s, b) => s + b.lon, 0) / boreholes.length;

  _mapLeaflet = L.map('leaflet-map', { center: [latC, lonC], zoom: 15 });

  // Tile layers
  const tiles = {
    'OpenStreetMap': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 20,
    }),
    'Vệ tinh (Esri)': L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { attribution: '© Esri', maxZoom: 20 }),
    'Địa hình': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenTopoMap', maxZoom: 17 }),
    'Tối (CartoDB)': L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      { attribution: '© CartoDB', maxZoom: 20 }),
  };
  tiles['Vệ tinh (Esri)'].addTo(_mapLeaflet);

  // BH zone colors
  const BH_CLR = { KE:'#f59e0b', BXN:'#10b981', NHC:'#ef4444', QTT:'#ec4899', OTHER:'#6b7280' };

  // Layer groups
  const lgBH  = L.layerGroup();
  const lgKe  = L.layerGroup();
  const lgCDM = L.layerGroup();

  // Hố khoan markers
  boreholes.forEach(b => {
    const clr = BH_CLR[b.zone] || '#888';
    const icon = L.divIcon({
      html: `<div style="width:14px;height:14px;border-radius:50%;background:${clr};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>`,
      className: '', iconSize: [14, 14], iconAnchor: [7, 7],
    });
    const marker = L.marker([b.lat, b.lon], { icon });
    marker.bindPopup(`
      <div style="font-family:'Segoe UI',sans-serif;min-width:160px">
        <b>${b.name}</b><br>
        Zone: <b>${b.zone}</b><br>
        Cao độ: <b>${b.elevation_m?.toFixed(2) ?? '—'} m</b><br>
        Lat: ${b.lat.toFixed(6)}<br>Lon: ${b.lon.toFixed(6)}
      </div>`);
    // Tên HK label
    L.tooltip({ permanent: true, direction: 'top', offset: [0, -8],
                className: 'bh-label' })
      .setContent(`<span style="font-size:10px;font-weight:700;color:${clr}">${b.name.replace(/^(KE-|BXN-|NHC-|ND-)/,'')}</span>`)
      .setLatLng([b.lat, b.lon])
      .addTo(lgBH);
    marker.addTo(lgBH);
  });

  // Ranh kè polylines
  ke_lines.forEach(ll => {
    L.polyline(ll, { color: '#e5e7eb', weight: 1.5, opacity: 0.8 }).addTo(lgKe);
  });

  // CDM vùng — bounding box + centroid
  cdm_zones.forEach(z => {
    const clr = z.zone === 'KE' ? '#7c3aed' : '#1d4ed8';
    if (z.bbox && z.bbox.length === 4) {
      L.rectangle(
        [[Math.min(...z.bbox.map(c=>c[0])), Math.min(...z.bbox.map(c=>c[1]))],
         [Math.max(...z.bbox.map(c=>c[0])), Math.max(...z.bbox.map(c=>c[1]))]],
        { color: clr, weight: 1.5, fillOpacity: 0.08, dashArray: '6 4' }
      ).bindPopup(`<b>CDM ${z.zone === 'CONG_VIEN' ? 'Công viên' : 'Kè'}</b><br>${z.n.toLocaleString('vi-VN')} cọc`)
      .addTo(lgCDM);
    }
    L.circleMarker([z.lat, z.lon], { radius: 8, color: clr, fillColor: clr, fillOpacity: 0.5 })
      .bindTooltip(`CDM ${z.zone === 'CONG_VIEN' ? 'Công viên' : 'Kè'}: ${z.n.toLocaleString('vi-VN')} cọc`, { permanent: false })
      .addTo(lgCDM);
  });

  // Add all layers
  lgCDM.addTo(_mapLeaflet);
  lgKe.addTo(_mapLeaflet);
  lgBH.addTo(_mapLeaflet);

  // Layer control
  L.control.layers(tiles, {
    'Hố khoan': lgBH,
    'Ranh kè': lgKe,
    'Vùng CDM': lgCDM,
  }, { collapsed: false }).addTo(_mapLeaflet);

  // Scale
  L.control.scale({ metric: true, imperial: false }).addTo(_mapLeaflet);

  // Fit bounds
  const allLats = boreholes.map(b=>b.lat);
  const allLons = boreholes.map(b=>b.lon);
  _mapLeaflet.fitBounds([
    [Math.min(...allLats)-0.003, Math.min(...allLons)-0.003],
    [Math.max(...allLats)+0.003, Math.max(...allLons)+0.003],
  ]);

  // Tables
  const BH_BADGE = { KE:'ke', BXN:'bxn', NHC:'nhc', QTT:'qtt', OTHER:'ke' };
  document.getElementById('geo-bh-tbl').innerHTML = `<table>
    <thead><tr><th>Tên HK</th><th>Zone</th><th>Z (m)</th><th>Lat</th><th>Lon</th></tr></thead>
    <tbody>${boreholes.map(b=>`<tr>
      <td style="cursor:pointer;color:#93c5fd" onclick="_mapLeaflet.setView([${b.lat},${b.lon}],18)">${b.name}</td>
      <td><span class="badge ${BH_BADGE[b.zone]||'ke'}">${b.zone}</span></td>
      <td>${b.elevation_m?.toFixed(2)??'—'}</td>
      <td>${b.lat.toFixed(5)}</td><td>${b.lon.toFixed(5)}</td>
    </tr>`).join('')}</tbody></table>`;

  document.getElementById('geo-cdm-tbl').innerHTML = `<table>
    <thead><tr><th>Khu vực</th><th>Số cọc</th><th>Lat TT</th><th>Lon TT</th></tr></thead>
    <tbody>${cdm_zones.map(z=>`<tr>
      <td><span class="badge ${z.zone==='KE'?'ke':'cv'}">${z.zone==='CONG_VIEN'?'Công viên':'Kè'}</span></td>
      <td>${z.n.toLocaleString('vi-VN')}</td>
      <td>${z.lat.toFixed(5)}</td><td>${z.lon.toFixed(5)}</td>
    </tr>`).join('')}</tbody></table>`;
}

  if (_pyodide) { onStatus('Python đã sẵn sàng'); return _pyodide; }
  onStatus('Tải Pyodide runtime (~10 MB)…');
  if (!window.loadPyodide) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = PYODIDE_URL + 'pyodide.js';
      s.onload = res;
      s.onerror = () => rej(new Error('Không tải được pyodide.js — kiểm tra kết nối mạng'));

  onStatus('Khởi tạo Python interpreter…');

  onStatus('Tải numpy + scipy (~30 MB)…');
  await _pyodide.loadPackage(['numpy', 'scipy']);
  onStatus('Python sẵn sàng');

import numpy as np
from scipy.sparse import lil_matrix
from scipy.sparse.linalg import spsolve

# ── 1-D FEM: Cọc chịu tải ngang — Winkler foundation ──
# (Euler-Bernoulli beam + distributed Winkler springs)
EI   = 3.0e5   # kN·m²  (SW-840, L=20m)
kh   = 4000.0  # kN/m²  (hệ số nền × đường kính)
P    = 50.0    # kN     (tải ngang đỉnh cọc)
L    = 20.0    # m      (chiều dài cọc)
n    = 40      # số phần tử
h    = L / n   # chiều dài mỗi phần tử
ndof = (n+1)*2 # 2 DOF/node: [w, θ]

def beam_k(EI, h):
    c = EI / h**3
    return c * np.array([
        [ 12,    6*h,  -12,    6*h],
        [  6*h,  4*h**2, -6*h,  2*h**2],
        [-12,   -6*h,   12,   -6*h],
        [  6*h,  2*h**2, -6*h,  4*h**2],
    ])

def spring_k(kh, h):
    c = kh * h / 420
    return c * np.array([
        [ 156,  22*h,   54, -13*h],
        [  22*h, 4*h**2, 13*h, -3*h**2],
        [  54,  13*h,  156, -22*h],
        [ -13*h,-3*h**2,-22*h,  4*h**2],
    ])

K = lil_matrix((ndof, ndof))
for i in range(n):
    ke  = beam_k(EI, h) + spring_k(kh, h)
    idx = [2*i, 2*i+1, 2*i+2, 2*i+3]
    for a in range(4):
        for b in range(4):
            K[idx[a], idx[b]] += ke[a, b]

f = np.zeros(ndof)
f[0] = P  # tải ngang tại đỉnh

# BC: ngàm tại đáy → w[n]=0, θ[n]=0
fixed = [ndof-2, ndof-1]
free  = [i for i in range(ndof) if i not in fixed]

Kff = K.tocsr()[free][:, free]
ff  = f[free]
u_f = spsolve(Kff, ff)
u   = np.zeros(ndof)
u[free] = u_f

w   = u[0::2]          # chuyển vị ngang (m)
th  = u[1::2]          # góc xoay (rad)
depths = np.linspace(0, L, n+1)

# Bending moment từ curvature xấp xỉ
M = np.zeros(n+1)
for i in range(n):
    ue = u[[2*i, 2*i+1, 2*i+2, 2*i+3]]
    M[i]   += abs(beam_k(EI,h)[[1],:]@ue)[0]
    M[i+1] += abs(beam_k(EI,h)[[3],:]@ue)[0]
M /= 2

u_max_mm = w[0]*1000
M_max    = M.max()
z_Mmax   = depths[M.argmax()]

print(f"Chuyển vị đỉnh  : {u_max_mm:.3f} mm")
print(f"Moment max      : {M_max:.1f} kN·m  tại z={z_Mmax:.1f} m")
print(f"Chuyển vị tại z=5m: {w[int(5/h)*1 if 5/h==int(5/h) else int(5/h)]:.5f} m")
print("OK — sparse solver scipy.sparse.linalg.spsolve")
`;

#include &lt;emscripten/bind.h&gt;
#include &lt;vector&gt;
#include &lt;cmath&gt;
using namespace std;
using namespace emscripten;

// Gaussian elimination solver (không phụ thuộc thư viện ngoài)
vector&lt;double&gt; gauss_solve(vector&lt;vector&lt;double&gt;&gt; A, vector&lt;double&gt; b) {
    int n = b.size();
    for (int i=0;i&lt;n;i++){
        for (int k=i+1;k&lt;n;k++){
            double f = A[k][i]/A[i][i];
            for (int j=i;j&lt;n;j++) A[k][j] -= f*A[i][j];
            b[k] -= f*b[i];
        }
    }
    vector&lt;double&gt; x(n);
    for (int i=n-1;i&gt;=0;i--){
        x[i]=b[i];
        for (int j=i+1;j&lt;n;j++) x[i]-=A[i][j]*x[j];
        x[i]/=A[i][i];
    }
    return x;
}

val solve_winkler(double EI, double kh, double P, double L, int n) {
    double h = L/n;
    int ndof = (n+1)*2;
    vector&lt;vector&lt;double&gt;&gt; K(ndof, vector&lt;double&gt;(ndof,0));
    vector&lt;double&gt; f(ndof,0);
    // Assemble beam + spring stiffness...
    f[0] = P;
    // Apply BC: fix last 2 DOF
    // ... (omitted for brevity)
    auto u = gauss_solve(K, f);
    val result = val::array();
    for (auto v : u) result.call&lt;void&gt;("push", v);
    return result;
}

EMSCRIPTEN_BINDINGS(fem) {
    function("solve_winkler", &solve_winkler);
}

use wasm_bindgen::prelude::*;
use nalgebra::{DMatrix, DVector};

#[wasm_bindgen]
pub fn solve_winkler(ei: f64, kh: f64, p_load: f64, length: f64, n: usize) -> Vec&lt;f64&gt; {
    let h = length / n as f64;
    let ndof = (n + 1) * 2;
    let mut k = DMatrix::&lt;f64&gt;::zeros(ndof, ndof);
    let mut f = DVector::&lt;f64&gt;::zeros(ndof);
    // assemble beam + winkler matrices...
    f[0] = p_load;
    // apply BC: ngàm đáy
    let kff = k.view((2, 2), (ndof-2, ndof-2)).into_owned();
    let ff  = f.rows(2, ndof-2).into_owned();
    let u   = kff.lu().solve(&amp;ff).unwrap();
    let mut result = vec![0.0; 2];
    result.extend(u.iter().copied());
    result
}

// ─────────────────────────────────────────────────────────────────────────────
// Three.js demo — 3D pile deformation + soil layers
// ─────────────────────────────────────────────────────────────────────────────
async function _demoThree(T, containerId) {
  _stopThree();
  const container=document.getElementById(containerId);
  container.innerHTML='';
  const W=container.clientWidth||600, H=420;

  const renderer=new T.WebGLRenderer({antialias:true});
  renderer.setSize(W,H); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x1a1c24);
  container.appendChild(renderer.domElement);

  const scene=new T.Scene();
  const camera=new T.PerspectiveCamera(42,W/H,0.1,300);

  scene.add(new T.AmbientLight(0xffffff,0.6));
  const dir=new T.DirectionalLight(0xffffff,0.9);
  dir.position.set(8,5,12); scene.add(dir);

  // Soil slabs (split view — left & right of pile)
  const SLABS=[
    {y0:0,  h:4,  c:0x4a6fa5, lbl:'Bùn sét (1b)'},
    {y0:4,  h:7,  c:0x4a8a6a, lbl:'Sét dẻo (2a)'},
    {y0:11, h:6,  c:0xb89050, lbl:'Sét cứng (3)'},
    {y0:17, h:3,  c:0xd8b070, lbl:'Cát (5a)'},
  ];
  SLABS.forEach(s=>{
    [-3, 3].forEach(xOff=>{
      const g=new T.BoxGeometry(2.8,s.h,3.8);
      const m=new T.MeshPhongMaterial({color:s.c,transparent:true,opacity:.72,specular:0x222233,shininess:20});
      const mesh=new T.Mesh(g,m);
      mesh.position.set(xOff,-(s.y0+s.h/2),-0.5);
      scene.add(mesh);
      const eg=new T.EdgesGeometry(g);
      const el=new T.LineSegments(eg,new T.LineBasicMaterial({color:0x334455,transparent:true,opacity:.4}));
      el.position.copy(mesh.position); scene.add(el);
    });
  });

  // Ground plane
  const gnd=new T.Mesh(new T.PlaneGeometry(10,8),
    new T.MeshPhongMaterial({color:0x2d5a27,transparent:true,opacity:.5,side:T.DoubleSide}));
  gnd.rotation.x=-Math.PI/2; scene.add(gnd);

  // Pile (static grey)
  const pileG=new T.BoxGeometry(0.14,20,0.55);
  const pileM=new T.MeshPhongMaterial({color:0x93c5fd,shininess:90,specular:0x224466});
  const pileStatic=new T.Mesh(pileG,pileM); pileStatic.position.set(0,-10,0); scene.add(pileStatic);

  // Winkler springs (horizontal red lines along pile)
  for (let zi=1;zi<=19;zi+=1.4){
    [[-1.4,-0.12],[ 0.12, 1.4]].forEach(([x0,x1])=>{
      const g=new T.BufferGeometry();
      g.setAttribute('position',new T.Float32BufferAttribute([x0,-zi,0,x1,-zi,0],3));
      scene.add(new T.Line(g,new T.LineBasicMaterial({color:0xef4444,transparent:true,opacity:.6})));
    });
  }

  // Deformed pile (animated) — Winkler analytical solution
  const N=50, PL=20;
  const lam=Math.pow(4000/(4*3e5),0.25);
  const wArr=Array.from({length:N+1},(_,i)=>{
    const z=i*PL/N;
    return 50/(2*3e5*lam**3)*Math.exp(-lam*z)*(Math.cos(lam*z)+Math.sin(lam*z));
  });
  const wMax=Math.max(...wArr);
  const defGroup=new T.Group(); scene.add(defGroup);

  let angle=0, tAnim=0;
  function render(){
    _threeRAF=requestAnimationFrame(render);
    angle+=0.006; tAnim+=0.022;
    const amp=(Math.sin(tAnim)*0.5+0.5);
    const SCALE=120;

    defGroup.clear();
    // Build colored deformed line
    const pts=[], clrs=[];
    wArr.forEach((w,i)=>{
      pts.push(w*amp*SCALE, -i*PL/N, 0.05);
      const c=new T.Color().setHSL(0.66*(1-Math.abs(w)/wMax),1,.55);
      clrs.push(c.r,c.g,c.b);
    });
    const dg=new T.BufferGeometry();
    dg.setAttribute('position',new T.Float32BufferAttribute(pts,3));
    dg.setAttribute('color',new T.Float32BufferAttribute(clrs,3));
    defGroup.add(new T.Line(dg,new T.LineBasicMaterial({vertexColors:true,linewidth:4})));

    // Horizontal displacement tick at top
    const top_w=wArr[0]*amp*SCALE;
    const tg=new T.BufferGeometry();
    tg.setAttribute('position',new T.Float32BufferAttribute([0,0,0.05,top_w,0,0.05],3));
    defGroup.add(new T.Line(tg,new T.LineBasicMaterial({color:0xfbbf24,linewidth:2})));

    // Orbit camera
    const r=18, cy=-9;
    camera.position.set(Math.sin(angle)*r,cy+3,Math.cos(angle)*r);
    camera.lookAt(0,-9,0);
    renderer.render(scene,camera);
  }
  render();
}

// ─────────────────────────────────────────────────────────────────────────────
// Babylon.js demo — CDM pile field
// ─────────────────────────────────────────────────────────────────────────────
async function _demoBabylon(canvas) {
  if (_babylonEngine) { _babylonEngine.stopRenderLoop(); _babylonEngine.dispose(); }
  const {Engine,Scene,ArcRotateCamera,HemisphericLight,DirectionalLight,
         Vector3,Color3,Color4,MeshBuilder,StandardMaterial,
         Animation,ActionManager,ExecuteCodeAction} = BABYLON;

  const engine=new Engine(canvas,true,{preserveDrawingBuffer:true});
  _babylonEngine=engine;
  const scene=new Scene(engine);
  scene.clearColor=new Color4(0.1,0.11,0.14,1);

  const cam=new ArcRotateCamera('cam',-Math.PI/3,Math.PI/3.5,35,Vector3.Zero(),scene);
  cam.lowerRadiusLimit=15; cam.upperRadiusLimit=80;
  cam.attachControl(canvas,true);

  new HemisphericLight('hemi',new Vector3(0,1,0),scene).intensity=0.55;
  const sun=new DirectionalLight('sun',new Vector3(-1,-2,-1),scene);
  sun.intensity=0.8;

  // Ground slab
  const gnd=MeshBuilder.CreateBox('gnd',{width:22,height:0.15,depth:26},scene);
  gnd.position.y=-0.075;
  const gndMat=new StandardMaterial('gm',scene);
  gndMat.diffuseColor=new Color3(0.13,0.16,0.18); gnd.material=gndMat;

  // CDM pile field 12×15
  const STATUS={hoan_thanh:0,dang_thi_cong:1,chua_thi_cong:2};
  const CLR={
    0: new Color3(0.06,0.72,0.51),  // green
    1: new Color3(0.96,0.62,0.04),  // amber
    2: new Color3(0.22,0.22,0.28),  // dark
  };
  const NX=12,NY=15,DX=1.7,DZ=1.6;
  const mats={};
  Object.entries(CLR).forEach(([k,c])=>{
    const m=new StandardMaterial('m'+k,scene);
    m.diffuseColor=c; m.emissiveColor=c.scale(0.25);
    mats[k]=m;
  });

  const piles=[];
  for(let ix=0;ix<NX;ix++) for(let iy=0;iy<NY;iy++){
    const r=Math.random();
    const st=r>.42?0:r>.22?1:2;
    const L=14+Math.random()*6;
    const pile=MeshBuilder.CreateCylinder(`p${ix}_${iy}`,
      {diameter:0.55+0.1*(st===0?1:0),height:L,tessellation:10},scene);
    pile.position=new Vector3((ix-NX/2)*DX,-L/2,(iy-NY/2)*DZ);
    pile.material=mats[st];
    piles.push({mesh:pile,st,L,ix,iy});
  }

  // Tooltip on hover
  scene.actionManager=new ActionManager(scene);
  piles.forEach(({mesh,st,ix,iy})=>{
    mesh.actionManager=new ActionManager(scene);
    mesh.actionManager.registerAction(new ExecuteCodeAction(
      ActionManager.OnPointerOverTrigger, ()=>{
        const lbl=document.getElementById('babylon-status');
        const s=['Hoàn thành','Đang thi công','Chưa thi công'][st];
        lbl.textContent=`Cọc (${ix+1},${iy+1}) — ${s}`;
      }
    ));
  });

  // Stats
  const nDone =piles.filter(p=>p.st===0).length;
  const nGoing=piles.filter(p=>p.st===1).length;
  const nPend =piles.filter(p=>p.st===2).length;
  const stat=document.getElementById('babylon-status');
  stat.innerHTML=`<span style="color:#10b981">&#9632; ${nDone} hoàn thành</span> &nbsp;`
    +`<span style="color:#f59e0b">&#9632; ${nGoing} đang thi công</span> &nbsp;`
    +`<span style="color:#6b7280">&#9632; ${nPend} chưa thi công</span>`;

  engine.runRenderLoop(()=>scene.render());
  window.addEventListener('resize',()=>engine.resize());
}

// Helper: run sql.js query and render table
function _sqljsRunQuery() {
  if (!window._sqljsDb) return;
  const q = document.getElementById('sqljs-input').value.trim();
  const res = document.getElementById('sqljs-result');
  try {
    const results = window._sqljsDb.exec(q);
    if (!results.length) { res.innerHTML='<span style="color:#a0aec0">(0 rows)</span>'; return; }
    const { columns, values } = results[0];
    let t=`<table style="font-size:.78rem;border-collapse:collapse;width:100%"><thead><tr>`
      + columns.map(c=>`<th style="background:#2d3748;padding:.25rem .4rem;border:1px solid #4a5568">${c}</th>`).join('')
      + `</tr></thead><tbody>`;
    values.forEach(row => {
      t+=`<tr>`+row.map(v=>`<td style="padding:.2rem .4rem;border:1px solid #2d3748">${v??''}</td>`).join('')+`</tr>`;
    });
    t+=`</tbody></table><div style="color:#a0aec0;font-size:.75rem;margin-top:.35rem">${values.length} dòng</div>`;
    res.innerHTML=t;
  } catch(e) { res.innerHTML=`<span style="color:#f87171">${e.message}</span>`; }
}

        scene.add(mesh);
        const edge=new T.LineSegments(new T.EdgesGeometry(geo),new T.LineBasicMaterial({color:0x1a1a2e}));

    const S=parseFloat(document.getElementById('cjs-stotal').value)||85;
    const Cv=parseFloat(document.getElementById('cjs-cv').value)||1.8;
    const Hdr=parseFloat(document.getElementById('cjs-h').value)||12;
    const Tmax=parseFloat(document.getElementById('cjs-t').value)||10;
    // Terzaghi U(t) = 1 - 8/pi^2 * sum_m exp(-M^2 * Tv) for first 15 terms
    const nPts=80;
    const labels=[], datasets=[];
    const palettes={
      'Không xử lý':{cv:Cv,  c:'#ef4444'},
      'PVD (l=10m)': {cv:Cv*8, c:'#f59e0b'},
      'CDM (β)':     {cv:999, c:'#10b981',S_frac:.38}, // near-instant
    };
    for (let i=0;i<=nPts;i++) labels.push((i*Tmax/nPts).toFixed(1));
    Object.entries(palettes).forEach(([name,p]) => {
      const pts=labels.map(t => {
        const tv=parseFloat(t)*(p.cv||Cv)/(Hdr*Hdr);
        if (name==='CDM (β)') {
          return parseFloat(t)===0 ? 0 : S*0.38;
        }
        let U=0;
        for (let m=0;m<15;m++) { const M=Math.PI*(2*m+1)/2; U+=8/(Math.PI*Math.PI)*Math.exp(-M*M*tv)/((2*m+1)*(2*m+1)); }
        U=Math.max(0,Math.min(1,1-U));
        return S*U;
      });
      datasets.push({ label:name, data:pts, borderColor:p.c, backgroundColor:'transparent', tension:.3, pointRadius:0, borderWidth:2 });
    });
    if (_chartJsInst) { _chartJsInst.destroy(); _chartJsInst=null; }

        },

        backgroundColor:'#1a1c24',
      }
    });
  }

async function _deckRender(D, container) {
  if (_deckInst) { try { _deckInst.finalize(); } catch(e){} _deckInst=null; }
  const zone=document.getElementById('deck-zone').value;
  const url=zone==='all'?'/api/cdm/toado':'/api/cdm/toado?zone='+zone;
  const data=await api(url);
  const pts=data.points;
  if (!pts.length) { document.getElementById('deck-status').textContent='Không có dữ liệu'; return; }

  // Normalize coords to pixel space
  const ex=pts.map(p=>p.y), ey=pts.map(p=>p.x);
  const cx=(Math.min(...ex)+Math.max(...ex))/2;
  const cy=(Math.min(...ey)+Math.max(...ey))/2;
  const span=Math.max(Math.max(...ex)-Math.min(...ex), Math.max(...ey)-Math.min(...ey))||1;
  const ZONE_CLR={KE:[16,185,129],BXN:[245,158,11],NHC:[167,139,250]};
  const getClr=z=>(ZONE_CLR[z]||[100,116,139]);

  container.innerHTML='<div id="deck-tooltip" style="position:absolute;background:rgba(0,0,0,.85);color:#e2e8f0;padding:.35rem .6rem;border-radius:4px;font-size:.78rem;pointer-events:none;display:none;z-index:10"></div>';
  const tooltip=document.getElementById('deck-tooltip');

  _deckInst = new D.DeckGL({
    container,
    views: [new D.OrthographicView({ id:'ov' })],
    initialViewState: {
      target:[0,0,0], zoom:Math.log2(Math.min(container.clientWidth,container.clientHeight)/span*0.7),
      minZoom:-10, maxZoom:10,
    },
    controller:true,
    layers:[
      new D.ScatterplotLayer({
        id:'cdm-pts',
        data: pts,
        getPosition: d => [(d.y-cx)/span*container.clientWidth*0.9, (d.x-cy)/span*container.clientHeight*0.9, 0],
        getRadius: ()=>2.5,
        radiusUnits:'pixels',
        getFillColor: d => getClr(d.z),
        opacity:.85,
        pickable:true,
        onHover: ({object, x, y}) => {
          if (object) {
            tooltip.style.display='block'; tooltip.style.left=x+8+'px'; tooltip.style.top=y-30+'px';
            tooltip.textContent=`${object.n} (${object.z})`;
          } else { tooltip.style.display='none'; }
        },
      })
    ],
  });
  document.getElementById('deck-status').textContent=`${pts.length.toLocaleString()} điểm CDM — GPU WebGL render`;
}

async function _loadRustWasm() {
  if (window._rustGeo) return window._rustGeo;
  const mod = await import('/static/rust-wasm/geotech_wasm.js');
  await mod.default();   // init() — tải file .wasm cùng thư mục
  window._rustGeo = mod;
  return mod;
}

async function _loadCWasm() {
  if (window._cWinkler) return window._cWinkler;
  return new Promise((res, rej) => {
    window.Module = {
      onRuntimeInitialized() { window._cWinkler = window.Module; res(window.Module); }
    };
    const s = document.createElement('script');
    s.src = '/static/c-wasm/winkler.js';
    s.onerror = () => rej(new Error('C WASM load failed'));
    document.head.appendChild(s);
  });
}

      ${[['P (kN)','c-p','100','10'],['kh (kN/m³)','c-kh','8000','500'],['D (m)','c-d','0.6','0.05'],['EI (kN.m²)','c-ei','25000','1000']].map(([l,id,v,s])=>
        `<div><label style="display:block;font-size:.75rem;color:#a0aec0;margin-bottom:.2rem">${l}</label>
         <input id="${id}" type="number" value="${v}" step="${s}" style="width:100%;background:#262730;border:1px solid #4a5568;color:#e2e8f0;padding:.25rem .4rem;border-radius:3px;font-size:.82rem"></div>`
      ).join('')}
    </div>
    <div class="cols2" style="gap:1rem">
      <div id="c-result" style="background:#111;border:1px solid #2d3748;border-radius:4px;padding:.75rem;font-size:.9rem;color:#a0f0a0;min-height:80px"></div>
      <div style="height:260px"><div id="c-chart" style="height:100%"></div></div>
    </div>
    <div class="info-box" style="margin-top:.75rem;font-size:.78rem">
      <b>Nguồn gốc:</b> <code>winkler_beam.c</code> (50 dòng C thuần) →
      <code>emcc winkler_beam.c -o winkler.js -O2</code> → 940 bytes WASM chạy trong browser.
      Cùng code có thể dùng trong PLAXIS Python API hoặc standalone.
    </div>
  </div>`;

  // ── A: Rust WASM ─────────────────────────────────────────────────────────────
  let _rustMod = null;
  let _rustSiChart = null, _rustBcChart = null;

  document.getElementById('btn-rust-load').addEventListener('click', async () => {
    const btn=document.getElementById('btn-rust-load');
    const stat=document.getElementById('rust-status');
    btn.disabled=true; stat.textContent='Đang tải Rust WASM (40 KB)…';
    try {
      _rustMod = await _loadRustWasm();
      document.getElementById('rust-demo').style.display='block';
      document.getElementById('rust-tag').innerHTML='<span style="color:#f59e0b">&#10003; 40 KB loaded</span>';
      stat.textContent='Rust WASM sẵn sàng — tính toán chạy tại tốc độ native';
      btn.textContent='Tải lại'; btn.disabled=false;
      _rustUpdateAll();
      // Auto-update on input change
      ['rust-h','rust-cc','rust-cs','rust-e0','rust-pc','rust-sv0','rust-dsv',
       'rust-st','rust-cv','rust-hd','rust-tm',
       'rust-c','rust-phi','rust-gam','rust-b','rust-df'].forEach(id =>
        document.getElementById(id).addEventListener('input', _rustUpdateAll));
    } catch(e) { stat.textContent='Lỗi: '+e.message; btn.disabled=false; }
  });

  function _rustUpdateAll() {
    if (!_rustMod) return;
    _rustCalcSettlement();
    _rustCalcTimeSeries();
    _rustCalcBearing();
  }

  function _rustCalcSettlement() {
    const H=+v('rust-h'), Cc=+v('rust-cc'), Cs=+v('rust-cs'), e0=+v('rust-e0');
    const PC=+v('rust-pc'), sv0=+v('rust-sv0'), dsv=+v('rust-dsv');
    const si = _rustMod.calc_primary_settlement(H,Cc,Cs,e0,PC,sv0,dsv);
    const svf=sv0+dsv;
    const oc = svf<=PC?'OC':sv0>=PC?'NC':'cross-PC';
    const clr = oc==='OC'?'#10b981':oc==='NC'?'#f59e0b':'#a78bfa';
    document.getElementById('rust-si-result').innerHTML =
      `<div style="font-size:1.4rem;font-weight:700;color:#a0f0a0">Si = ${si.toFixed(2)} cm</div>`+
      `<div style="margin-top:.3rem">Trạng thái: <span style="color:${clr};font-weight:600">${oc}</span></div>`+
      `<div style="font-size:.78rem;color:#718096;margin-top:.3rem">σ'v0=${sv0} → σ'vf=${svf} kPa | PC=${PC} kPa</div>`;
    // Bar chart showing stress vs PC
    if (_rustSiChart) { _rustSiChart.destroy(); _rustSiChart=null; }
    _rustSiChart = new Chart(document.getElementById('rust-si-chart'), {
      type:'bar',
      data:{ labels:['σ\'v0','σ\'vf','PC'],
             datasets:[{data:[sv0,svf,PC],backgroundColor:['#3b82f6','#f59e0b','#10b981'],borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
        scales:{x:{ticks:{color:'#718096'},grid:{color:'#2d3748'}},y:{ticks:{color:'#a0aec0'},grid:{display:false}}},
        plugins:{legend:{display:false},tooltip:{callbacks:{label:p=>`${p.raw} kPa`}}}}
    });
  }

  function _rustCalcTimeSeries() {
    const st=+v('rust-st'), cv=+v('rust-cv'), hd=+v('rust-hd'), tm=+v('rust-tm');
    const json = _rustMod.settlement_time_series(st, cv, hd, tm, 80);
    const pts = JSON.parse(json);
    const t50 = pts.find(p=>p.s>=st*0.5)?.t?.toFixed(1)||'>'+tm;
    const t90 = pts.find(p=>p.s>=st*0.9)?.t?.toFixed(1)||'>'+tm;
    Plotly.react('rust-ts-chart',[{
      x:pts.map(p=>p.t), y:pts.map(p=>p.s),
      mode:'lines', line:{color:'#10b981',width:2.5},
      fill:'tozeroy', fillcolor:'rgba(16,185,129,.12)',
      name:'S(t)'
    }],{
      ...DARK.layout,
      xaxis:{...DARK.layout.xaxis, title:'Thời gian (năm)'},
      yaxis:{...DARK.layout.yaxis, title:'Lún tích lũy (cm)', autorange:'reversed'},
      annotations:[
        {x:parseFloat(t50)||tm*0.5, y:st*0.5, text:`t₅₀=${t50}yr`, showarrow:true, arrowcolor:'#f59e0b', font:{color:'#f59e0b',size:11}},
        {x:parseFloat(t90)||tm*0.9, y:st*0.9, text:`t₉₀=${t90}yr`, showarrow:true, arrowcolor:'#a78bfa', font:{color:'#a78bfa',size:11}},
      ],
      margin:{t:20,r:20,b:40,l:55}, height:210,
    },{responsive:true,displayModeBar:false});
  }

  function _rustCalcBearing() {
    const c=+v('rust-c'), phi=+v('rust-phi'), gam=+v('rust-gam'), B=+v('rust-b'), Df=+v('rust-df');
    const qu = _rustMod.bearing_capacity_terzaghi(c, phi, gam, B, Df);
    const qa3=qu/3, qa25=qu/2.5;
    document.getElementById('rust-bc-result').innerHTML =
      `<div style="font-size:1.4rem;font-weight:700;color:#a0f0a0">qu = ${qu.toFixed(0)} kPa</div>`+
      `<div style="margin-top:.3rem">qa (Fs=3.0) = <b>${qa3.toFixed(0)} kPa</b></div>`+
      `<div>qa (Fs=2.5) = <b>${qa25.toFixed(0)} kPa</b></div>`;
    if (_rustBcChart) { _rustBcChart.destroy(); _rustBcChart=null; }
    _rustBcChart = new Chart(document.getElementById('rust-bc-chart'), {
      type:'doughnut',
      data:{ labels:['Dùng (Fs=3)','Dự phòng'],
             datasets:[{data:[qa3, qu-qa3], backgroundColor:['#10b981','#2d3748'], borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'65%',
        plugins:{legend:{labels:{color:'#a0aec0',font:{size:11}}},
                 tooltip:{callbacks:{label:p=>`${p.label}: ${p.raw.toFixed(0)} kPa`}}}}
    });
  }

  // ── B: C WASM ──────────────────────────────────────────────────────────────
  let _cMod = null;

  document.getElementById('btn-c-load').addEventListener('click', async () => {
    const btn=document.getElementById('btn-c-load');
    const stat=document.getElementById('c-status');
    btn.disabled=true; stat.textContent='Đang tải C WASM (940 bytes)…';
    try {
      _cMod = await _loadCWasm();
      document.getElementById('c-demo').style.display='block';
      document.getElementById('c-tag').innerHTML='<span style="color:#60a5fa">&#10003; 940 B loaded</span>';
      stat.textContent='C WASM sẵn sàng';
      btn.textContent='Tải lại'; btn.disabled=false;
      _cCalcWinkler();
      ['c-p','c-kh','c-d','c-ei'].forEach(id =>
        document.getElementById(id).addEventListener('input', _cCalcWinkler));
    } catch(e) { stat.textContent='Lỗi: '+e.message; btn.disabled=false; }
  });

  function _cCalcWinkler() {
    if (!_cMod) return;
    const P=+v('c-p'), kh=+v('c-kh'), D=+v('c-d'), EI=+v('c-ei');
    try {
      const u_mm  = _cMod.ccall('winkler_max_deflection','number',['number','number','number','number'],[P,kh,D,EI]);
      const M_kNm = _cMod.ccall('winkler_moment',        'number',['number','number','number','number'],[P,kh,D,EI]);
      document.getElementById('c-result').innerHTML =
        `<div style="font-size:1.2rem;font-weight:700;color:#60a5fa">u_max = ${u_mm.toFixed(1)} mm</div>`+
        `<div style="margin-top:.3rem;font-size:1.1rem">M_max = ${M_kNm.toFixed(1)} kN.m</div>`+
        `<div style="font-size:.78rem;color:#718096;margin-top:.5rem">`+
        `β = ${Math.pow(kh*D/(4*EI),0.25).toFixed(4)} m⁻¹ | `+
        `z_Mmax = ${(Math.PI/(4*Math.pow(kh*D/(4*EI),0.25))).toFixed(2)} m</div>`;
      // Winkler profile chart
      const beta=Math.pow(kh*D/(4*EI),0.25);
      const zArr=[],uArr=[],mArr=[];
      for(let i=0;i<=60;i++){
        const z=i*0.5;
        zArr.push(-z);
        uArr.push(P/(2*beta*EI)*Math.exp(-beta*z)*Math.cos(beta*z)*1000);
        mArr.push(P/beta*Math.exp(-beta*z)*Math.sin(beta*z));
      }
      Plotly.react('c-chart',[
        {x:uArr, y:zArr, name:'u (mm)',   xaxis:'x',  mode:'lines', line:{color:'#60a5fa',width:2}},
        {x:mArr, y:zArr, name:'M (kN.m)', xaxis:'x2', mode:'lines', line:{color:'#f59e0b',width:2}},
      ],{
        ...DARK.layout,
        xaxis :{...DARK.layout.xaxis, title:'u (mm)',   domain:[0,.45], zeroline:true, zerolinecolor:'#4a5568'},
        xaxis2:{...DARK.layout.xaxis, title:'M (kN.m)', domain:[.55,1], zeroline:true, zerolinecolor:'#4a5568', anchor:'y'},
        yaxis :{...DARK.layout.yaxis, title:'Chiều sâu (m)'},
        showlegend:true, legend:{x:.5,y:-0.12,orientation:'h',font:{color:'#a0aec0',size:11}},
        margin:{t:20,r:20,b:50,l:60}, height:250,
      },{responsive:true,displayModeBar:false});
    } catch(e) { document.getElementById('c-result').innerHTML=`<span style="color:#f87171">Lỗi: ${e.message}</span>`; }
  }

  function v(id){ return document.getElementById(id)?.value??0; }
}

  function _initFabric() {

    _fabricCanvas.on('object:moving', e => {
      if (!snapOn()) return;
      const obj = e.target;
      obj.set({ left: Math.round(obj.left/SNAP)*SNAP, top: Math.round(obj.top/SNAP)*SNAP });
    });

    const addRect = () => {
      _fabricCanvas.add(new fabric.Rect({
        left:80, top:80, width:120, height:80, fill:'rgba(49,130,206,0.3)',
        stroke:'#63b3ed', strokeWidth:1.5, rx:3,

    };
    const addCircle = () => {
      _fabricCanvas.add(new fabric.Circle({
        left:200, top:150, radius:45, fill:'rgba(104,211,145,0.2)',
        stroke:'#68d391', strokeWidth:1.5,
      }));
    };
    const addLine = () => {
      _fabricCanvas.add(new fabric.Line([50,400,750,400], {
        stroke:'#fbd38d', strokeWidth:1.5, strokeDashArray:[6,4],

    const addText = () => {

    };

    // Draw grid
    for (let x=0; x<=800; x+=SNAP) {
      _fabricCanvas.add(new fabric.Line([x,0,x,500],{stroke:'#1e2535',strokeWidth:.5,selectable:false,evented:false}));
    }
    for (let y=0; y<=500; y+=SNAP) {
      _fabricCanvas.add(new fabric.Line([0,y,800,y],{stroke:'#1e2535',strokeWidth:.5,selectable:false,evented:false}));

    const cxArr=[80,160,240,320,400,480,560,640,720];
    const cyArr=[100,200,300,400];

  function _initKonva() {
    if (_konvaStage) { _konvaStage.destroy(); _konvaStage=null; }
    const K = window.Konva;
    const typeMap = {
      SW840:{H:840,B:300,t_f:16,t_w:10,strands_y:[120,280,560,720]},
      SW940:{H:940,B:300,t_f:16,t_w:10,strands_y:[120,280,660,820]},
      SW1000:{H:1000,B:320,t_f:18,t_w:12,strands_y:[130,310,690,870]},
      SW1200:{H:1200,B:320,t_f:20,t_w:12,strands_y:[150,380,820,1050]},
    };
    const pType = document.getElementById('konva-pile-type').value;
    const nStrands = parseInt(document.getElementById('konva-strands').value)||4;
    const p = typeMap[pType]||typeMap['SW940'];
    const scale = 300/p.H;
    const W_px = Math.round(p.B*scale)+80, H_px = Math.round(p.H*scale)+80;
    const ox=40, oy=40;
    const Hp=Math.round(p.H*scale), Bp=Math.round(p.B*scale);
    const tf=Math.round(p.t_f*scale), tw=Math.round(p.t_w*scale);

    const container = document.getElementById('konva-container');
    container.style.width=W_px+'px'; container.style.height=H_px+'px';
    _konvaStage = new K.Stage({container:'konva-container',width:W_px,height:H_px});
    const layer = new K.Layer();
    _konvaStage.add(layer);

    // I-section
    const shapes = [
      // top flange
      {x:ox,y:oy,w:Bp,h:tf},
      // bottom flange
      {x:ox,y:oy+Hp-tf,w:Bp,h:tf},
      // web
      {x:ox+Math.round(Bp/2)-Math.round(tw/2),y:oy+tf,w:tw,h:Hp-2*tf},
    ];
    shapes.forEach(s => {
      layer.add(new K.Rect({x:s.x,y:s.y,width:s.w,height:s.h,
        fill:'#2b6cb0',stroke:'#90cdf4',strokeWidth:1}));
    });

    // DUL strands (distribute evenly in web)
    const allY = nStrands<=4 ? p.strands_y.slice(0,nStrands) :
      Array.from({length:nStrands},(_, i)=>Math.round(p.t_f*1.5+(p.H-p.t_f*3)*i/(nStrands-1)));
    allY.forEach(sy => {
      const syp = oy + Math.round(sy*scale);
      const cxp = ox + Math.round(Bp/2);
      layer.add(new K.Circle({x:cxp,y:syp,radius:Math.max(4,Math.round(7*scale)),
        fill:'#f6ad55',stroke:'#f6e05e',strokeWidth:1}));
      // dimension line
      layer.add(new K.Line({points:[ox+Bp+4,syp,ox+Bp+20,syp],stroke:'#718096',strokeWidth:.8,dash:[3,3]}));
      layer.add(new K.Text({x:ox+Bp+22,y:syp-7,text:`${sy} mm`,fill:'#a0aec0',fontSize:9}));
    });

    // Dimension labels
    layer.add(new K.Arrow({points:[ox,oy+Hp+18,ox+Bp,oy+Hp+18],stroke:'#a0aec0',strokeWidth:.8,fill:'#a0aec0',pointerLength:5,pointerWidth:4}));
    layer.add(new K.Text({x:ox+Bp/2-15,y:oy+Hp+22,text:`B=${p.B}mm`,fill:'#a0aec0',fontSize:10}));
    layer.add(new K.Arrow({points:[ox-18,oy+Hp,ox-18,oy],stroke:'#a0aec0',strokeWidth:.8,fill:'#a0aec0',pointerLength:5,pointerWidth:4}));
    layer.add(new K.Text({x:2,y:oy+Hp/2-20,text:`H=${p.H}mm`,fill:'#a0aec0',fontSize:10,rotation:-90}));
    layer.add(new K.Text({x:ox,y:4,text:pType,fill:'#90cdf4',fontSize:13,fontStyle:'bold'}));

    layer.draw();

    const A = p.B*p.t_f*2 + p.t_w*(p.H-2*p.t_f);
    const Ix = (p.B*Math.pow(p.H,3) - (p.B-p.t_w)*Math.pow(p.H-2*p.t_f,3))/12;
    const Wx = Ix/(p.H/2);
    document.getElementById('konva-params').innerHTML =
      `Diện tích mặt cắt: <b>${(A/100).toFixed(0)} cm²</b><br>`+
      `I_x ≈ <b>${(Ix/1e8).toFixed(0)} cm⁴</b><br>`+
      `W_x ≈ <b>${(Wx/1e6).toFixed(0)} cm³</b><br>`+
      `Cáp DUL: <b>${nStrands} bó</b><br>`+
      `Bề dày bản cánh: <b>${p.t_f} mm</b><br>`+
      `Bề dày bản bụng: <b>${p.t_w} mm</b>`;
    document.getElementById('konva-info').textContent =
      `Tỷ lệ vẽ: 1:${Math.round(1/scale)} (${scale.toFixed(3)} px/mm)`;
  }

  function _initPaper() {
    const paper = window.paper;
    paper.setup(document.getElementById('paper-canvas'));
    const pts = [];
    let hullPath = null, fillPath = null;

    function _convexHull(points) {
      if (points.length < 3) return points;
      const sorted = [...points].sort((a,b)=>a.x-b.x||a.y-b.y);
      const lower=[], upper=[];
      for (const p of sorted) {
        while (lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],p)<=0) lower.pop();
        lower.push(p);
      }
      for (const p of [...sorted].reverse()) {
        while (upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],p)<=0) upper.pop();
        upper.push(p);
      }
      upper.pop(); lower.pop();
      return lower.concat(upper);
    }
    function cross(O,A,B){ return (A.x-O.x)*(B.y-O.y)-(A.y-O.y)*(B.x-O.x); }
    function polyArea(pts){ let s=0; for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;s+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;} return Math.abs(s)/2; }
    function polyPerim(pts){ let s=0; for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;s+=Math.hypot(pts[j].x-pts[i].x,pts[j].y-pts[i].y);} return s; }

    function redraw() {
      paper.project.activeLayer.removeChildren();
      // axes
      const ax = new paper.Path.Line(new paper.Point(0,190),new paper.Point(500,190));
      ax.strokeColor='#2d3748'; ax.strokeWidth=1;
      const ay = new paper.Path.Line(new paper.Point(250,0),new paper.Point(250,380));
      ay.strokeColor='#2d3748'; ay.strokeWidth=1;

      if (pts.length>=3) {
        const hull = _convexHull(pts.map(p=>({x:p.x,y:p.y})));
        if (fillPath) fillPath.remove();
        fillPath = new paper.Path({segments:hull.map(h=>new paper.Point(h.x,h.y)),
          closed:true,fillColor:new paper.Color(0.2,0.5,0.8,0.15),
          strokeColor:'#63b3ed',strokeWidth:1.5,dashArray:[6,4]});

        const area_px2 = polyArea(hull);
        const perim_px = polyPerim(hull);
        const scale_m = 300; // 1px = 1/300 m (canvas 500px ~ ~1.7m)
        const area_m2 = (area_px2/(scale_m*scale_m)).toFixed(3);
        const perim_m = (perim_px/scale_m).toFixed(2);
        document.getElementById('paper-result').innerHTML =
          `Số điểm: <b>${pts.length}</b><br>`+
          `Convex hull: <b>${hull.length} đỉnh</b><br>`+
          `Diện tích (px²): <b>${area_px2.toFixed(1)}</b><br>`+
          `Diện tích (m²): <b>${area_m2}</b> <span style="color:#718096;font-size:.8em">(scale: 1px=1/${scale_m}m)</span><br>`+
          `Chu vi: <b>${perim_m} m</b>`;
      } else {
        document.getElementById('paper-result').innerHTML =
          `<span style="color:#718096">Thêm ≥3 điểm để tính<br>Hiện có: <b>${pts.length}</b> điểm</span>`;
      }

      pts.forEach((p,i) => {
        const c = new paper.Path.Circle({center:p,radius:5,fillColor:'#f6ad55',strokeColor:'#f6e05e',strokeWidth:1});
        const t = new paper.PointText({point:[p.x+8,p.y-4],content:`P${i+1}`,fillColor:'#a0aec0',fontSize:10});
      });
      paper.view.draw();
    }

    const tool = new paper.Tool();
    tool.onMouseDown = e => { pts.push(e.point); redraw(); };

    document.getElementById('paper-clear').addEventListener('click',()=>{ pts.length=0; redraw(); });
    document.getElementById('paper-demo').addEventListener('click',()=>{
      pts.length=0;
      [[80,80],[200,50],[380,90],[450,180],[420,310],[280,360],[120,330],[60,200]].forEach(([x,y])=>pts.push(new paper.Point(x,y)));
      redraw();
    });
    redraw();
  }

  function _buildThree3D() {
    if (_threeStatsAF) { cancelAnimationFrame(_threeStatsAF); _threeStatsAF=null; }
    const THREE = window.THREE;
    const Stats = window.Stats;
    if (!THREE) { document.getElementById('three2-info').textContent='Three.js chưa tải'; return; }

    const canvas = document.getElementById('three2-canvas');
    const W=760, H_cv=480;
    const renderer = new THREE.WebGLRenderer({canvas,antialias:true});
    renderer.setSize(W,H_cv); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setClearColor(0x0d1117);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, W/H_cv, 0.1, 500);
    camera.position.set(25,18,30);

    // Lights
    const ambLight = new THREE.AmbientLight(0xffffff,0.5);
    const dirLight = new THREE.DirectionalLight(0xffffff,1.2);
    dirLight.position.set(10,20,15);
    scene.add(ambLight, dirLight);

    // Grid ground
    const grid = new THREE.GridHelper(40,20,0x2d3748,0x1e2535);
    grid.position.y=-0.01;
    scene.add(grid);

    // Axes
    if (document.getElementById('three2-axes').checked) {
      scene.add(new THREE.AxesHelper(8));
    }

    // CDM columns as InstancedMesh
    const D=parseFloat(document.getElementById('jscad-D')?.value)||0.6;
    const s=parseFloat(document.getElementById('jscad-s')?.value)||1.5;
    const H_col=parseFloat(document.getElementById('jscad-H')?.value)||20;
    const nr=parseInt(document.getElementById('jscad-nr')?.value)||4;
    const nc=parseInt(document.getElementById('jscad-nc')?.value)||6;
    const n=nr*nc;
    const wireOn=document.getElementById('three2-wireframe').checked;
    const colorVal=parseInt(document.getElementById('three2-color').value)||0xed8936;

    const geom = new THREE.CylinderGeometry(D/2, D/2, H_col, 20);
    const mat = new THREE.MeshLambertMaterial({color:colorVal,wireframe:wireOn});
    const mesh = new THREE.InstancedMesh(geom, mat, n);

    const dummy = new THREE.Object3D();
    let idx=0;
    for(let i=0;i<nr;i++) for(let j=0;j<nc;j++){
      dummy.position.set(j*s - (nc-1)*s/2, -H_col/2, i*s - (nr-1)*s/2);
      dummy.updateMatrix();
      mesh.setMatrixAt(idx++, dummy.matrix);
    }
    scene.add(mesh);

    // Soil layer planes
    const soilColors=[0x2d4a1e,0x3d3d1e,0x1e2d3d];
    const depthLabelZ=[-5,-12,-20];
    soilColors.forEach((c,i)=>{
      const plane=new THREE.Mesh(
        new THREE.PlaneGeometry((nc+1)*s, (nr+1)*s),
        new THREE.MeshLambertMaterial({color:c,transparent:true,opacity:0.4,side:THREE.DoubleSide})
      );
      plane.rotation.x=-Math.PI/2;
      plane.position.y=depthLabelZ[i]||(-5*(i+1));
      scene.add(plane);
    });

    // OrbitControls (lazy import)
    _loadThree().then(()=>import('https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/controls/OrbitControls.js').then(m=>{
      const ctrl=new m.OrbitControls(camera,canvas);
      ctrl.enableDamping=true; ctrl.dampingFactor=0.05;
      ctrl.update();

      // Stats
      let statsPanel = null;
      if (Stats) {
        statsPanel = new Stats();
        statsPanel.showPanel(0);
        statsPanel.dom.style.cssText='position:static;';
        const sc=document.getElementById('stats-container');
        sc.innerHTML=''; sc.appendChild(statsPanel.dom);
      }

      const animate=()=>{
        _threeStatsAF=requestAnimationFrame(animate);
        ctrl.update();
        renderer.render(scene,camera);
        if(statsPanel) statsPanel.update();
      };
      animate();
    })).catch(()=>{
      // fallback without controls
      const animate=()=>{
        _threeStatsAF=requestAnimationFrame(animate);
        camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),0.003);
        camera.lookAt(0,0,0);
        renderer.render(scene,camera);
      };
      animate();
    });

    const totalVol=(D/2)**2*Math.PI*H_col*n;
    document.getElementById('three2-info').innerHTML=
      `InstancedMesh: <b>${n} trụ CDM</b> · D=${D}m · s=${s}m · H=${H_col}m · `+
      `Thể tích: <b>${totalVol.toFixed(1)} m³</b> · `+
      `Tỷ lệ a: <b>${((D/2)**2*Math.PI/(s**2)*100).toFixed(1)}%</b>`;
  }

  function _buildReactFlow(React, ReactDOM, RF) {
    const { ReactFlow, Background, Controls, MiniMap } = RF;
    const container = document.getElementById('rf-container');
    const nodes = [
      {id:'1',type:'default',position:{x:200,y:10},data:{label:'Lớp đắp (1) · γ=18 kN/m³ · H=3m'}},
      {id:'2',type:'default',position:{x:200,y:80},data:{label:'Bùn sét mềm (1b) · Su=15 kPa · H=15m'}},
      {id:'3',type:'default',position:{x:200,y:150},data:{label:'Sét dẻo cứng (2) · Su=40 kPa · H=8m'}},
      {id:'4',type:'default',position:{x:200,y:220},data:{label:'Cát trung (4) · N=25 · H=10m'}},
      {id:'5',type:'default',position:{x:200,y:290},data:{label:'Đá phong hóa (6) · N>50'}},
      {id:'cdm1',type:'default',position:{x:550,y:80},data:{label:'Trụ CDM (1b) · D=0.6m · s=1.5m'}},
      {id:'cdm2',type:'default',position:{x:550,y:150},data:{label:'Trụ CDM (2) · a=12.6%'}},
      {id:'sw1',type:'default',position:{x:820,y:80},data:{label:'Cọc ván SW-940 · L=25m'}},
    ];
    const edges=[
      {id:'e12',source:'1',target:'2',animated:true},
      {id:'e23',source:'2',target:'3',animated:true},
      {id:'e34',source:'3',target:'4'},
      {id:'e45',source:'4',target:'5'},
      {id:'e2cdm1',source:'2',target:'cdm1',style:{stroke:'#f6ad55'},label:'xử lý'},
      {id:'e3cdm2',source:'3',target:'cdm2',style:{stroke:'#f6ad55'},label:'xử lý'},
      {id:'e2sw',source:'2',target:'sw1',style:{stroke:'#90cdf4'},label:'kè'},
    ];
    try {
      const root = ReactDOM.createRoot(container);
      root.render(
        React.createElement(ReactFlow,{nodes,edges,fitView:true,style:{background:'#0d1117',width:'100%',height:'400px'}},
          React.createElement(Background,{color:'#2d3748',gap:20}),
          React.createElement(Controls,null),
          React.createElement(MiniMap,{style:{background:'#1a202c'}})
        )
      );
    } catch(e) {
      container.innerHTML=`<div style="padding:1rem;color:#f87171">React Flow render lỗi: ${e.message}</div>`;
    }
  }
}

        {text:`Cong trinh: ${proj}`, style:'sub'},
        {
          table:{
            headerRows:1, widths:['auto','auto','auto','auto','auto','auto','auto'],
            body:[
              [{text:'Ho khoan',style:'th'},{text:'D(m)',style:'th'},{text:'s(m)',style:'th'},
               {text:'a(%)',style:'th'},{text:'L TK',style:'th'},{text:'NT1',style:'th'},{text:'NT2',style:'th'}],
              ...hkData,
            ],
          },
          layout:{

            hLineColor:()=>'#cccccc', vLineColor:()=>'#cccccc',
