        {text:'TINH LUN CO KET', style:'h2', tocItem:true, pageBreak:nHK>5?'before':undefined},
        {text:'Ket qua tinh toan lun nen (TCCS 41:2022):',style:'body'},
        {
          ul:['Lun khong xu ly: S = 107 cm','CDM (a=12.6%): S1 = 35.6 cm (giam 67%)','Thoi gian dat U=90%: 3.2 nam (PVD)'],
          style:'body', margin:[0,4,0,8],
        },
      ],
      styles:{
        h1:{fontSize:14,bold:true,color:'#1a3a6b',margin:[0,12,0,6]},
        h2:{fontSize:12,bold:true,color:'#2b6cb0',margin:[0,10,0,4]},
        sub:{fontSize:9,color:'#555',margin:[0,0,0,8]},
        th:{fontSize:9,bold:true,color:'white'},
        body:{fontSize:9,color:'#333',lineHeight:1.5},
        headerLeft:{fontSize:8,color:'#555',alignment:'left'},
        headerRight:{fontSize:8,color:'#555',alignment:'right'},
        footer:{fontSize:8,color:'#888',alignment:'center'},

      defaultStyle:{fontSize:9,font:'Roboto'},

    return docDef;
  }

  function _bindPdfMake() {
    document.getElementById('btn-pm-gen').addEventListener('click', ()=>{
      pdfMake.createPdf(_buildPmDoc()).download('bao_cao_pdfmake.pdf');
    });
    document.getElementById('btn-pm-preview').addEventListener('click', ()=>{
      pdfMake.createPdf(_buildPmDoc()).open();
    });
  }

  // ── WeasyPrint demo ───────────────────────────────────────────────────────────
  document.getElementById('btn-wp-send').addEventListener('click', async ()=>{
    const btn  = document.getElementById('btn-wp-send');
    const stat = document.getElementById('wp-status');
    const html = document.getElementById('wp-html').value;
    const fmt  = document.getElementById('wp-format').value;
    const marg = document.getElementById('wp-margin').value;
    btn.disabled=true; stat.textContent='Đang gửi lên server…';
    try {
      const res = await fetch('/api/pdf/weasyprint', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({html, page_size:fmt, margin_cm:parseFloat(marg)}),
      });
      if (!res.ok) {
        const err=await res.json(); throw new Error(err.error||res.statusText);
      }
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href=url; a.download='report_weasyprint.pdf'; a.click();
      stat.innerHTML='<span style="color:#68d391">&#10003; PDF tải xuống thành công</span>';
    } catch(e) {
      stat.innerHTML=`<span style="color:#f87171">&#10007; ${e.message}</span>`;
    } finally { btn.disabled=false; }
  });

  // ── Puppeteer demo ────────────────────────────────────────────────────────────
  document.getElementById('btn-pp-send').addEventListener('click', async ()=>{
    const btn  = document.getElementById('btn-pp-send');
    const stat = document.getElementById('pp-status');

    const land = document.getElementById('pp-landscape').checked;
    const sampleHtml = document.getElementById('wp-html').value; // reuse WeasyPrint textarea
    btn.disabled=true; stat.textContent='Đang gửi lên Puppeteer :9099…';

      const res = await fetch('http://localhost:9099/pdf', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({html:sampleHtml, format:fmt, landscape:land, margin:'1.5cm', waitMs:200}),
      });
      if (!res.ok) { const e=await res.json(); throw new Error(e.error||res.statusText); }
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a'); a.href=url; a.download='report_puppeteer.pdf'; a.click();
      stat.innerHTML='<span style="color:#68d391">&#10003; PDF tải xuống thành công (Puppeteer)</span>';
    } catch(e) {
      stat.innerHTML=`<span style="color:#f87171">&#10007; ${e.message} — khởi động start_puppeteer.bat</span>`;
    } finally { btn.disabled=false; }
  });

  // ── react-pdf demo ────────────────────────────────────────────────────────────
  document.getElementById('btn-rpdf-load').addEventListener('click', async ()=>{
    const loadBtn = document.getElementById('btn-rpdf-load');
    const stat    = document.getElementById('rpdf-status');
    loadBtn.disabled=true; stat.textContent='Đang tải react-pdf qua esm.sh (~5-10s)…';
    try {
      const mod = await _loadReactPdf();
      document.getElementById('tag-reactpdf').innerHTML='react-pdf <span style="color:#68d391">&#10003;</span>';
      stat.innerHTML='<span style="color:#68d391">&#10003; @react-pdf/renderer sẵn sàng</span>';
      document.getElementById('btn-rpdf-gen').style.display='block';
      document.getElementById('btn-rpdf-gen').addEventListener('click', async ()=>{
        const { Document, Page, Text, View, StyleSheet, pdf } = mod;
        const styles = StyleSheet.create({
          page:{padding:40,fontFamily:'Helvetica'},
          title:{fontSize:18,fontWeight:'bold',color:'#1a3a6b',marginBottom:12,textAlign:'center'},
          section:{marginBottom:10},
          row:{flexDirection:'row',borderBottom:'1px solid #eee',paddingBottom:4,marginBottom:4},
          cell:{flex:1,fontSize:9},
          hdr:{backgroundColor:'#1a3a6b',flexDirection:'row',padding:4},
          hdrCell:{flex:1,fontSize:9,color:'white'},
        });
        const data=[['KE-HK1','SW-940','25.0','Dat'],['KE-HK2','SW-940','26.0','Dat'],['KE-HK10','SW-940','29.5','Dat']];
        const MyDoc = () =>
          React.createElement(Document, null,
            React.createElement(Page, {size:'A4', style:styles.page},
              React.createElement(View,null,
                React.createElement(Text,{style:styles.title},'Ket qua Kiem tra Coc van SW'),
                React.createElement(View,{style:styles.hdr},
                  ['Ho khoan','Coc','L TK(m)','NT1/NT2'].map((h,i)=>
                    React.createElement(Text,{key:i,style:styles.hdrCell},h))),
                ...data.map((r,ri)=>
                  React.createElement(View,{key:ri,style:styles.row},
                    r.map((c,ci)=>React.createElement(Text,{key:ci,style:styles.cell},c))
                  )
                )
              )
            )
          );
        try {
          const blob = await pdf(React.createElement(MyDoc)).toBlob();
          const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='report_reactpdf.pdf';a.click();
          stat.innerHTML='<span style="color:#68d391">&#10003; PDF tải xuống (react-pdf)</span>';
        } catch(e2){
          stat.innerHTML=`<span style="color:#f87171">&#10007; ${e2.message}</span>`;
        }
      });
    } catch(e) {
      stat.innerHTML=`<span style="color:#f87171">&#10007; ${e.message}</span>`;
      loadBtn.disabled=false;
    }
  });
}

// ── Ctrl+P: chuẩn bị content trước khi in ───────────────────────────────────
// Plotly nền tối (#1a1c24/#262730) inline trong SVG → CSS không override.
// Phải gọi Plotly.relayout() đổi sang nền trắng + chữ đen cho dễ đọc PDF.
const _PRINT_LIGHT = {
  paper_bgcolor: '#ffffff', plot_bgcolor: '#ffffff',
  'font.color': '#111111',
  'xaxis.gridcolor': '#dddddd', 'yaxis.gridcolor': '#dddddd',
  'xaxis.linecolor': '#999999', 'yaxis.linecolor': '#999999',
  'xaxis.tickcolor': '#666666', 'yaxis.tickcolor': '#666666',
  'xaxis.zerolinecolor': '#bbbbbb', 'yaxis.zerolinecolor': '#bbbbbb',
  'legend.bgcolor': 'rgba(255,255,255,0.95)',
  'legend.bordercolor': '#cccccc', 'legend.font.color': '#111111',
  'title.font.color': '#111111',
};
const _PRINT_DARK = {
  paper_bgcolor: '#262730', plot_bgcolor: '#1a1c24',
  'font.color': '#fafafa',
  'xaxis.gridcolor': '#3d3d4f', 'yaxis.gridcolor': '#3d3d4f',
  'xaxis.linecolor': '#a0a0b0', 'yaxis.linecolor': '#a0a0b0',
  'xaxis.tickcolor': '#a0a0b0', 'yaxis.tickcolor': '#a0a0b0',
  'xaxis.zerolinecolor': '#3d3d4f', 'yaxis.zerolinecolor': '#3d3d4f',
  'legend.bgcolor': 'rgba(38,39,48,0.95)',
  'legend.bordercolor': '#3d3d4f', 'legend.font.color': '#fafafa',
  'title.font.color': '#fafafa',
};

window.addEventListener('beforeprint', () => {
  // Mở tất cả <details>
  document.querySelectorAll('details').forEach(d => {
    d.dataset._wasOpen = d.open ? '1' : '0';
    d.open = true;
  });
  // Plotly → light theme + resize
  if (window.Plotly) {
    document.querySelectorAll('.js-plotly-plot').forEach(p => {
      try {
        window.Plotly.relayout(p, _PRINT_LIGHT);
        window.Plotly.Plots.resize(p);
      } catch(_) {}
    });
  }
  // Chart.js canvas → nền trắng + axis đen
  document.querySelectorAll('canvas').forEach(c => {
    if (!c._chart || !c._chart.options) return;
    if (c._origBg === undefined) c._origBg = c.style.background || '';
    c.style.background = '#ffffff';
    try {
      const o = c._chart.options;
      if (o.plugins?.legend?.labels) {
        c._origLegendColor = o.plugins.legend.labels.color;
        o.plugins.legend.labels.color = '#111';
      }
      c._origTickColor = {}; c._origGridColor = {};
      ['x','y'].forEach(ax => {
        if (!o.scales?.[ax]) return;
        if (o.scales[ax].ticks) {
          c._origTickColor[ax] = o.scales[ax].ticks.color;
          o.scales[ax].ticks.color = '#111';
        }
        if (o.scales[ax].grid) {
          c._origGridColor[ax] = o.scales[ax].grid.color;
          o.scales[ax].grid.color = '#ddd';
        }
      });
      c._chart.update('none');
    } catch(_) {}
  });
  // Leaflet maps invalidate size để tiles re-render
  if (window._geoLeafletMap) {
    try { window._geoLeafletMap.invalidateSize(); } catch(_) {}
  }
  window.scrollTo(0, 0);
});

window.addEventListener('afterprint', () => {
  // Khôi phục <details>
  document.querySelectorAll('details').forEach(d => {
    if (d.dataset._wasOpen === '0') d.open = false;
    delete d.dataset._wasOpen;
  });
  // Khôi phục Plotly dark
  if (window.Plotly) {
    document.querySelectorAll('.js-plotly-plot').forEach(p => {
      try { window.Plotly.relayout(p, _PRINT_DARK); } catch(_) {}
    });
  }
  // Khôi phục Chart.js canvas
  document.querySelectorAll('canvas').forEach(c => {
    if (!c._chart || c._origBg === undefined) return;
    c.style.background = c._origBg;
    try {
      const o = c._chart.options;
      if (o.plugins?.legend?.labels && c._origLegendColor !== undefined) {
        o.plugins.legend.labels.color = c._origLegendColor;
      }
      ['x','y'].forEach(ax => {
        if (!o.scales?.[ax]) return;
        if (o.scales[ax].ticks && c._origTickColor?.[ax] !== undefined) {
          o.scales[ax].ticks.color = c._origTickColor[ax];
        }
        if (o.scales[ax].grid && c._origGridColor?.[ax] !== undefined) {
          o.scales[ax].grid.color = c._origGridColor[ax];
        }
      });
      c._chart.update('none');
    } catch(_) {}
    delete c._origBg; delete c._origLegendColor;
    delete c._origTickColor; delete c._origGridColor;
  });
});
</script>
